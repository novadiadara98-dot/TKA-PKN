<style>
/* Layout: layar mulai terbelah (panel identitas + formulir); layar soal = soal di kiri, navigasi nomor di kanan; hasil = skor + tinjauan per soal */
:root{
  --bg:#eef0fb; --surface:#ffffff; --ink:#141a40; --muted:#586091; --line:#dadef2;
  --brand:#2a2f93; --brand-ink:#ffffff; --sun:#ffbf1f; --sun-ink:#2a1d00;
  --ok:#17935c; --ok-bg:#dcf5e8; --warn:#f2a100; --warn-bg:#fff0cc; --bad:#d6334a; --bad-bg:#fde2e6;
  --idle:#e6e9f7; --idle-ink:#3b4278;
  --e-pancasila:#d6334a; --e-uud:#2a2f93; --e-bti:#0f8f8a; --e-nkri:#c77800;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1230; --surface:#171d4a; --ink:#eceffd; --muted:#a3abd8; --line:#2b3470;
  --brand:#8c93ff; --brand-ink:#0e1230; --sun:#ffc83d; --sun-ink:#2a1d00;
  --ok:#4fd08f; --ok-bg:#12372b; --warn:#ffb92e; --warn-bg:#41330c; --bad:#ff7b8f; --bad-bg:#431a29;
  --idle:#262e66; --idle-ink:#cfd4f7;
  --e-pancasila:#ff7b8f; --e-uud:#8c93ff; --e-bti:#43d1c9; --e-nkri:#ffb92e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1230; --surface:#171d4a; --ink:#eceffd; --muted:#a3abd8; --line:#2b3470;
  --brand:#8c93ff; --brand-ink:#0e1230; --sun:#ffc83d; --sun-ink:#2a1d00;
  --ok:#4fd08f; --ok-bg:#12372b; --warn:#ffb92e; --warn-bg:#41330c; --bad:#ff7b8f; --bad-bg:#431a29;
  --idle:#262e66; --idle-ink:#cfd4f7;
  --e-pancasila:#ff7b8f; --e-uud:#8c93ff; --e-bti:#43d1c9; --e-nkri:#ffb92e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;line-height:1.15}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}

/* ---------- Layar mulai ---------- */
.start{display:grid;grid-template-columns:1.05fr 1fr;gap:0;max-width:1040px;margin:0 auto;align-items:stretch;padding-block:24px}
.start-hero{background:var(--brand);color:var(--brand-ink);border-radius:24px 0 0 24px;padding:40px 36px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
:root[data-theme="dark"] .start-hero{color:#0e1230}
.flagbar{height:8px;border-radius:99px;background:linear-gradient(90deg,#e0243c 50%,#fff 50%);width:84px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.start-hero h1{font-size:clamp(1.9rem,4.2vw,2.7rem);font-weight:800;letter-spacing:-.02em}
.start-hero h1 span{color:var(--sun)}
.start-hero p{margin:0;max-width:34ch;opacity:.92}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;min-width:92px}
.fact b{display:block;font-family:var(--font-d);font-size:1.6rem;line-height:1}
.fact small{font-size:.78rem;opacity:.85}
.elems{margin-top:auto;display:grid;gap:8px}
.elems h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-family:var(--font-b);font-weight:700}
.elem-row{display:flex;gap:8px;align-items:center;font-size:.92rem}
.dot{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.start-card{background:var(--surface);border-radius:0 24px 24px 0;padding:40px 36px;display:flex;flex-direction:column;gap:18px;justify-content:center;border:1px solid var(--line);border-left:0}
.start-card h2{font-size:1.5rem}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.9rem}
.field input{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-width:0;width:100%}
.field input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.field.err input{border-color:var(--bad)}
.field .msg{color:var(--bad);font-size:.82rem;min-height:1.1em}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(1px)}
.btn-sun{background:var(--sun);color:var(--sun-ink);font-size:1.05rem;padding:14px 22px}
.btn-sun:hover{filter:brightness(1.05)}
.btn-brand{background:var(--brand);color:var(--brand-ink)}
.btn-ghost{background:var(--surface);border:2px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.theme-toggle{position:fixed;right:14px;bottom:14px;z-index:5;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.85rem}

.pickset{display:grid;grid-template-columns:1fr 1fr;gap:10px;border:0;padding:0;margin:0;min-width:0}
.pickset legend{font-weight:600;font-size:.9rem;padding:0;margin-bottom:6px}
.pk{display:grid;gap:2px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;cursor:pointer}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk b{font-family:var(--font-d);font-size:1.15rem}
.pk small{color:var(--muted)}
.pk:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.pk:has(input:focus-visible){outline:3px solid var(--sun);outline-offset:2px}
.foot{text-align:center;color:var(--muted);font-size:.88rem;padding:18px 16px 76px;margin-inline:-16px;border-top:1px solid var(--line)}
.foot b{color:var(--ink)}
/* ---------- Layar soal ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:10px 16px;background:var(--brand);color:var(--brand-ink);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
:root[data-theme="dark"] .topbar{color:#0e1230}
.who{min-width:0}
.who b{display:block;font-family:var(--font-d);font-size:1.05rem;overflow-wrap:anywhere}
.who small{opacity:.85;overflow-wrap:anywhere}
.timer{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border-radius:14px;padding:6px 14px}
.timer small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;display:block;line-height:1}
.timer b{font-family:var(--font-d);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.78}}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding-block:20px 90px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:18px;min-width:0}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qno{font-family:var(--font-d);font-weight:800;font-size:1.05rem;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:4px 12px}
:root[data-theme="dark"] .qno{color:#0e1230}
.tag{font-size:.78rem;font-weight:700;border-radius:99px;padding:3px 11px;background:color-mix(in srgb,var(--c,var(--brand)) 16%,transparent);color:var(--c,var(--brand));border:1px solid color-mix(in srgb,var(--c,var(--brand)) 40%,transparent)}
.tag.type{--c:var(--muted)}
.stem{white-space:pre-line;margin:0;font-size:1.06rem;max-width:68ch}
.instr{margin:0;color:var(--muted);font-size:.9rem;font-style:italic}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--bg);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--brand)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .l{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--idle);color:var(--idle-ink);flex:none}
.opt.mc .l{border-radius:9px}
.opt:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.opt:has(input:checked) .l{background:var(--brand);color:var(--brand-ink)}
.opt:has(input:focus-visible){outline:3px solid var(--sun);outline-offset:2px}
.opt .t{padding-top:3px;overflow-wrap:anywhere}
.cat{width:100%;border-collapse:separate;border-spacing:0 8px}
.cat th{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;padding:0 4px 2px}
.cat th:first-child{text-align:left}
.cat td{background:var(--bg);padding:12px;border-block:2px solid var(--line)}
.cat td:first-child{border-left:2px solid var(--line);border-radius:14px 0 0 14px;overflow-wrap:anywhere}
.cat td:last-child{border-right:2px solid var(--line);border-radius:0 14px 14px 0}
.cat td.c{width:5rem;text-align:center}
.pick{display:inline-block;cursor:pointer}
.pick input{position:absolute;opacity:0}
.pick span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted)}
.pick:hover span{border-color:var(--brand)}
.pick input:checked + span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pick input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}
.clear{justify-self:start;background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0;font-size:.88rem}
.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.btn-ragu{background:var(--warn-bg);color:var(--ink);border:2px solid var(--warn)}
.btn-ragu[aria-pressed="true"]{background:var(--warn);color:#2a1d00}
.actions .next{justify-self:end}
.actions .prev{justify-self:start}

.nav{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.nav h3{font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.nb{height:44px;border-radius:12px;border:2px solid transparent;font-weight:700;background:var(--idle);color:var(--idle-ink);font-variant-numeric:tabular-nums}
.nb.done{background:var(--ok);color:#fff}
:root[data-theme="dark"] .nb.done{color:#06281a}
.nb.ragu{background:var(--warn);color:#2a1d00}
.nb.cur{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 40%,transparent)}
.legend{display:grid;gap:6px;font-size:.88rem}
.legend div{display:flex;gap:8px;align-items:center}
.legend i{width:16px;height:16px;border-radius:5px;flex:none}
.legend b{margin-left:auto}
.i-done{background:var(--ok)}.i-ragu{background:var(--warn)}.i-idle{background:var(--idle);border:1px solid var(--line)}
.btn-finish{background:var(--bad);color:#fff;width:100%}
:root[data-theme="dark"] .btn-finish{color:#2a0610}

.modal{position:fixed;inset:0;z-index:30;background:rgba(10,14,40,.62);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;padding:26px;max-width:440px;width:100%;display:grid;gap:14px;border:1px solid var(--line)}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.modal ul{margin:0;padding-left:1.1rem;color:var(--muted)}

/* ---------- Hasil ---------- */
.res{padding-block:24px 80px;display:grid;gap:22px}
.score{background:var(--brand);color:var(--brand-ink);border-radius:24px;padding:28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
:root[data-theme="dark"] .score{color:#0e1230}
.ring{--p:0;width:176px;height:176px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p)*1%),rgba(255,255,255,.2) 0);display:grid;place-items:center}
.ring div{width:140px;height:140px;border-radius:50%;background:var(--brand);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:var(--font-d);font-size:3.3rem;font-weight:800}
.ring small{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:4px}
.ident{display:grid;gap:3px}
.ident h1{font-size:clamp(1.5rem,3.5vw,2.1rem);overflow-wrap:anywhere}
.ident dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;margin:8px 0 0}
.ident dt{opacity:.8}
.ident dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{font-family:var(--font-d);font-size:1.9rem;line-height:1.1;display:block}
.stat small{color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.part b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.elemscore{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.es{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 3rem;gap:12px;align-items:center;font-size:.92rem}
.bar{height:10px;border-radius:99px;background:var(--idle);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.es span:last-child{text-align:right;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters h2{margin-right:auto;font-size:1.4rem}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0e1230}
.rev{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--s);border-radius:18px;padding:20px;display:grid;gap:14px;min-width:0}
.rev.s-ok{--s:var(--ok)}.rev.s-part{--s:var(--warn)}.rev.s-bad{--s:var(--bad)}.rev.s-none{--s:var(--muted)}
.badge{font-size:.78rem;font-weight:700;border-radius:99px;padding:3px 11px}
.s-ok .badge{background:var(--ok-bg);color:var(--ok)}
.s-part .badge{background:var(--warn-bg);color:var(--ink)}
.s-bad .badge{background:var(--bad-bg);color:var(--bad)}
.s-none .badge{background:var(--idle);color:var(--idle-ink)}
.rev .pts{margin-left:auto;font-weight:700;color:var(--muted)}
.ropt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.ropt .l{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--idle);color:var(--idle-ink)}
.ropt.key{border-color:var(--ok);background:var(--ok-bg)}
.ropt.key .l{background:var(--ok);color:#fff}
.ropt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ropt.wrong .l{background:var(--bad);color:#fff}
.ropt .m{font-size:.76rem;font-weight:700;white-space:nowrap;padding-top:4px}
.ropt.key .m{color:var(--ok)}.ropt.wrong .m{color:var(--bad)}
.ropts{display:grid;gap:8px}
.bahas{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-radius:14px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--sun) 55%,transparent)}
.bahas h4{margin:0 0 4px;font-family:var(--font-d);font-size:.95rem}
.bahas p{margin:0}
.kunci{font-weight:700}
.note{color:var(--muted);font-size:.85rem;margin:0}
.res-actions{display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:900px){
  .start{grid-template-columns:1fr;padding-block:16px}
  .start-hero{border-radius:24px 24px 0 0;padding:28px 22px}
  .start-card{border-radius:0 0 24px 24px;border-left:1px solid var(--line);border-top:0;padding:26px 22px}
  .exam{grid-template-columns:minmax(0,1fr)}
  .nav{position:static}
  .score{grid-template-columns:1fr;justify-items:center;text-align:center}
  .ident dl{text-align:left}
  .es{grid-template-columns:minmax(0,1fr) 3rem}
  .es .bar{grid-column:1/-1;order:3}
}
@media (max-width:520px){
  .qcard{padding:16px}
  .actions{grid-template-columns:1fr 1fr}
  .actions .btn-ragu{grid-column:1/-1;order:-1}
  .cat td.c{width:3.6rem}
  .ropt{grid-template-columns:auto minmax(0,1fr)}
  .ropt .m{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
