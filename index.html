      <div class="facts" id="facts"></div>
      <div class="elems"><h3>Elemen yang diujikan</h3>${elems}</div>
    </section>
    <form class="start-card" id="startForm" novalidate>
      <fieldset class="pickset"><legend>Pilih paket</legend>
        ${[1,2].map(n=>`<label class="pk"><input type="radio" name="paket" value="${n}" ${S.set===n?'checked':''}><b>Try Out ${n}</b><small>${SETS[n].length} soal</small></label>`).join('')}
      </fieldset>
      <h2>Isi data peserta</h2>
      ${field('nama','Nama Siswa','Nama lengkap',sd.nama)}
      ${field('kelas','Kelas','Contoh: XII IPA 1',sd.kelas)}
      ${field('peserta','Peserta Didik','No. peserta atau NISN',sd.peserta)}
      ${field('sekolah','Asal Sekolah','Nama sekolah',sd.sekolah)}
      <button class="btn btn-sun" type="submit">Mulai Try Out</button>
      <p class="hint">Timer ${CONFIG.durasiMenit} menit mulai berjalan saat tombol ditekan. Jawaban otomatis dikumpulkan saat waktu habis.</p>
    </form>
  </main>`;
  const drawFacts = ()=>{ $('#facts').innerHTML = `<div class="fact"><b class="num">${SOAL.length}</b><small>soal</small></div><div class="fact"><b class="num">${CONFIG.durasiMenit}</b><small>menit</small></div><div class="fact"><b class="num">100</b><small>nilai maksimal</small></div>`; };
  drawFacts();
  document.querySelectorAll('input[name=paket]').forEach(r=>r.addEventListener('change',()=>{ useSet(+r.value); drawFacts(); }));
  $('#startForm').addEventListener('submit', e=>{
    e.preventDefault();
    const v = {}; let ok = true;
    ['nama','kelas','peserta','sekolah'].forEach(k=>{
      v[k] = $('#f-'+k).value.trim();
      const bad = !v[k];
      $('#f-'+k).closest('.field').classList.toggle('err',bad);
      $('#m-'+k).textContent = bad ? 'Bagian ini wajib diisi.' : '';
      if(bad) ok = false;
    });
    if(!ok){ const f = document.querySelector('.field.err input'); f && f.focus(); return; }
    S = {set:S.set||1, phase:'quiz', student:v, idx:0, answers:{}, ragu:{}, endAt:Date.now()+CONFIG.durasiMenit*60000, finishedAt:0, filter:'all'};
    save(); render(); window.scrollTo(0,0);
  });
}
function field(id,label,ph,val){
  return `<div class="field"><label for="f-${id}">${label}</label><input id="f-${id}" name="${id}" autocomplete="off" placeholder="${ph}" value="${esc(val||'')}"><span class="msg" id="m-${id}" role="alert"></span></div>`;
}

/* ---------- Layar soal ---------- */
function renderQuiz(){
  const st = S.student;
  $('#app').innerHTML = `
  <div class="topbar">
    <div class="who"><b>${esc(st.nama)}</b><small>Try Out ${S.set} · ${esc(st.kelas)} · ${esc(st.sekolah)}</small></div>
    <div class="timer" id="timer" role="timer" aria-live="off"><div><small>Sisa waktu</small><b id="clock">--:--</b></div></div>
  </div>
  <div class="wrap exam">
    <section class="qcard" id="qcard" aria-live="polite"></section>
    <aside class="nav" aria-label="Navigasi nomor soal">
      <h3>Navigasi Soal</h3>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
      <button class="btn btn-finish" id="finishBtn" type="button">Selesai &amp; Kumpulkan</button>
    </aside>
  </div>`;
  $('#finishBtn').onclick = confirmFinish;
  drawQ(); drawNav(); startTimer();
}
function qHTML(q){
  const a = S.answers[q.no];
  const e = ELEM[q.elemen]||{c:'var(--brand)'};
  let body = '';
  if(q.tipe==='pg'){
    body = `<div class="opts" role="radiogroup" aria-label="Pilihan jawaban">`+Object.entries(q.opsi).map(([l,t])=>
      `<label class="opt"><input type="radio" name="pg" value="${l}" ${a===l?'checked':''}><span class="l">${l}</span><span class="t">${esc(t)}</span></label>`).join('')+`</div>`;
  } else if(q.tipe==='mcma'){
    body = `<p class="instr">Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.</p><div class="opts">`+Object.entries(q.opsi).map(([l,t])=>
      `<label class="opt mc"><input type="checkbox" name="mc" value="${l}" ${(a||[]).includes(l)?'checked':''}><span class="l">${l}</span><span class="t">${esc(t)}</span></label>`).join('')+`</div>`;
  } else {
    body = `<p class="instr">Tentukan Benar atau Salah untuk setiap pernyataan.</p><table class="cat"><thead><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr></thead><tbody>`+
      q.pernyataan.map((t,i)=>`<tr><td>${esc(t)}</td>
      <td class="c"><label class="pick"><input type="radio" name="k${i}" data-i="${i}" value="1" ${a&&a[i]===1?'checked':''} aria-label="Benar, pernyataan ${i+1}"><span>B</span></label></td>
      <td class="c"><label class="pick"><input type="radio" name="k${i}" data-i="${i}" value="0" ${a&&a[i]===0?'checked':''} aria-label="Salah, pernyataan ${i+1}"><span>S</span></label></td></tr>`).join('')+`</tbody></table>`;
  }
  const last = S.idx===SOAL.length-1;
  return `
    <div class="qhead"><span class="qno num">Soal ${S.idx+1} <span style="opacity:.7">/ ${SOAL.length}</span></span>
      <span class="tag" style="--c:${e.c}">${esc(elLabel(q.elemen))}</span><span class="tag type">${TIPE[q.tipe]}</span></div>
    <p class="stem">${esc(q.soal)}</p>
    ${body}
    ${answered(q)?`<button class="clear" id="clearBtn" type="button">Hapus jawaban</button>`:''}
    <div class="actions">
      <button class="btn btn-ghost prev" id="prevBtn" type="button" ${S.idx===0?'disabled':''}>← Sebelumnya</button>
      <button class="btn btn-ragu" id="raguBtn" type="button" aria-pressed="${!!S.ragu[q.no]}">${S.ragu[q.no]?'Ragu-ragu ✓':'Ragu-ragu'}</button>
      ${last?`<button class="btn btn-sun next" id="nextBtn" type="button">Selesai</button>`:`<button class="btn btn-brand next" id="nextBtn" type="button">Selanjutnya →</button>`}
    </div>`;
}
function drawQ(){
  const q = SOAL[S.idx], c = $('#qcard');
  c.innerHTML = qHTML(q);
  c.onchange = ev=>{
    const t = ev.target; if(t.tagName!=='INPUT') return;
    if(t.name==='pg') S.answers[q.no] = t.value;
    else if(t.name==='mc') S.answers[q.no] = [...c.querySelectorAll('input[name=mc]:checked')].map(x=>x.value);
    else { const arr = (S.answers[q.no]||q.pernyataan.map(()=>null)).slice(); arr[+t.dataset.i] = +t.value; S.answers[q.no] = arr; }
    save(); drawNav(); const had = $('#clearBtn'); if(!had) { const f = document.activeElement; const nm = f && f.name; drawQ(); const n = nm && c.querySelector(`input[name="${nm}"]:focus, input[name="${nm}"]:checked`); n && n.focus(); }
  };
  $('#prevBtn').onclick = ()=>go(S.idx-1);
  $('#nextBtn').onclick = ()=> S.idx===SOAL.length-1 ? confirmFinish() : go(S.idx+1);
  $('#raguBtn').onclick = ()=>{ if(S.ragu[q.no]) delete S.ragu[q.no]; else S.ragu[q.no]=true; save(); drawQ(); drawNav(); };
  const cb = $('#clearBtn'); if(cb) cb.onclick = ()=>{ delete S.answers[q.no]; save(); drawQ(); drawNav(); };
}
function go(i){ if(i<0||i>=SOAL.length) return; S.idx = i; save(); drawQ(); drawNav(); const t = document.querySelector('.topbar'); window.scrollTo({top:0}); }
function stat(q){ return S.ragu[q.no] ? 'ragu' : (answered(q) ? 'done' : 'idle'); }
function drawNav(){
  $('#grid').innerHTML = SOAL.map((q,i)=>`<button type="button" class="nb ${stat(q)} ${i===S.idx?'cur':''}" data-i="${i}" aria-label="Soal ${i+1}, ${({done:'sudah dijawab',ragu:'ragu-ragu',idle:'belum dijawab'})[stat(q)]}" ${i===S.idx?'aria-current="true"':''}>${i+1}</button>`).join('');
  $('#grid').onclick = e=>{ const b = e.target.closest('.nb'); if(b) go(+b.dataset.i); };
  const n = {done:0,ragu:0,idle:0}; SOAL.forEach(q=>n[stat(q)]++);
  $('#legend').innerHTML = `<div><i class="i-done"></i>Sudah dijawab<b class="num">${n.done}</b></div><div><i class="i-ragu"></i>Ragu-ragu<b class="num">${n.ragu}</b></div><div><i class="i-idle"></i>Belum dijawab<b class="num">${n.idle}</b></div>`;
}
function fmt(ms){ const s = Math.max(0,Math.ceil(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; const p = n=>String(n).padStart(2,'0'); return (h?h+':':'')+p(m)+':'+p(x); }
function startTimer(){
  clearInterval(tick);
  const upd = ()=>{
    const left = S.endAt-Date.now();
    const c = $('#clock'); if(!c){ clearInterval(tick); return; }
    c.textContent = fmt(left);
    $('#timer').classList.toggle('warn', left<=5*60000);
    if(left<=0){ clearInterval(tick); finish(); }
  };
  upd(); tick = setInterval(upd,1000);
}
function confirmFinish(){
  const n = {idle:0,ragu:0}; SOAL.forEach(q=>{ if(!answered(q)) n.idle++; if(S.ragu[q.no]) n.ragu++; });
  const m = document.createElement('div'); m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML = `<div class="box"><h2>Kumpulkan jawaban?</h2>
    ${(n.idle||n.ragu)?`<ul>${n.idle?`<li>${n.idle} soal belum dijawab</li>`:''}${n.ragu?`<li>${n.ragu} soal masih ditandai ragu-ragu</li>`:''}</ul>`:`<p class="hint">Semua soal sudah dijawab.</p>`}
    <p class="hint">Setelah dikumpulkan, jawaban tidak bisa diubah.</p>
    <div class="row"><button class="btn btn-ghost" id="mNo" type="button">Kembali ke soal</button><button class="btn btn-finish" style="width:auto" id="mYes" type="button">Ya, kumpulkan</button></div></div>`;
  document.body.appendChild(m);
  $('#mNo').focus();
  $('#mNo').onclick = ()=>m.remove();
  $('#mYes').onclick = ()=>{ m.remove(); finish(); };
}
function finish(){ clearInterval(tick); S.phase='result'; S.finishedAt = Date.now(); save(); render(); window.scrollTo(0,0); }

/* ---------- Hasil ---------- */
const ST = {ok:'Benar', part:'Sebagian benar', bad:'Salah', none:'Tidak dijawab'};
function renderResult(){
  const r = hitung(), st = S.student;
  const f = S.filter;
  const byEl = Object.keys(ELEM).map(e=>{
    const ids = SOAL.map((q,i)=>q.elemen===e?i:-1).filter(i=>i>=0);
    const pts = ids.reduce((s,i)=>s+r.g[i].pts,0);
    return {e, n:ids.length, pct: ids.length?Math.round(pts/ids.length*100):0};
  }).filter(x=>x.n);
  const show = SOAL.map((q,i)=>({q,i,g:r.g[i]})).filter(x=> f==='all' || (f==='ok'&&x.g.st==='ok') || (f==='bad'&&(x.g.st==='bad'||x.g.st==='part')) || (f==='none'&&x.g.st==='none'));
  const tgl = new Date(S.finishedAt||Date.now()).toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'});
  $('#app').innerHTML = `
  <div class="wrap res">
    <section class="score">
      <div class="ring" style="--p:${r.nilai}"><div><span><b class="num">${r.nilai%1?r.nilai.toFixed(1):r.nilai}</b><small>Nilai akhir</small></span></div></div>
      <div class="ident"><small style="opacity:.85">Hasil Try Out ${S.set} · Pendalaman TKA Pendidikan Pancasila Tingkat Lanjut</small>
        <h1>${esc(st.nama)}</h1>
        <dl><dt>Kelas</dt><dd>${esc(st.kelas)}</dd><dt>Peserta Didik</dt><dd>${esc(st.peserta)}</dd><dt>Asal Sekolah</dt><dd>${esc(st.sekolah)}</dd><dt>Selesai</dt><dd>${esc(tgl)}</dd></dl>
      </div>
    </section>
    <section class="stats">
      <div class="stat ok"><b class="num">${r.ok}</b><small>Benar penuh</small></div>
      <div class="stat part"><b class="num">${r.part}</b><small>Sebagian benar</small></div>
      <div class="stat bad"><b class="num">${r.bad}</b><small>Salah</small></div>
      <div class="stat"><b class="num">${r.none}</b><small>Tidak dijawab</small></div>
    </section>
    <section class="elemscore"><h3>Capaian per elemen</h3>${byEl.map(x=>`<div class="es"><span>${esc(elLabel(x.e))} <span style="color:var(--muted)">(${x.n} soal)</span></span><div class="bar"><i style="width:${x.pct}%;--c:${ELEM[x.e].c}"></i></div><span class="num">${x.pct}%</span></div>`).join('')}</section>
    <p class="note">Cara menghitung: pilihan ganda bernilai 1 bila benar. Pilihan ganda kompleks dihitung (jawaban benar dipilih dikurangi jawaban salah dipilih) dibagi jumlah kunci. Soal Benar/Salah dihitung dari jumlah pernyataan yang tepat. Nilai akhir adalah total skor dibagi ${SOAL.length} soal dikali 100.</p>
    <div class="filters"><h2>Pembahasan Soal</h2>
      ${[['all','Semua'],['ok','Benar'],['bad','Salah / sebagian'],['none','Tidak dijawab']].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${f===k}" type="button">${l}</button>`).join('')}
    </div>
    <div style="display:grid;gap:16px">${show.length?show.map(x=>reviewHTML(x.q,x.i,x.g)).join(''):'<p class="hint">Tidak ada soal pada kategori ini.</p>'}</div>
    <p class="note">${S.set===1?'Kunci dan pembahasan disusun dari analisis isi soal pada berkas sumber, bukan kunci resmi penyelenggara. Soal nomor 21 belum tersedia di berkas sehingga tidak diikutkan.':'Soal Try Out 2 disusun serupa dengan tipe soal Try Out 1. Kunci dan pembahasan disusun berdasarkan ketentuan UUD NRI Tahun 1945 dan materi Pendidikan Pancasila, bukan kunci resmi penyelenggara.'}</p>
    <div class="res-actions"><button class="btn btn-sun" id="again" type="button">Kembali ke Pilihan Try Out</button></div>
  </div>`;
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ S.filter=b.dataset.f; save(); const y = window.scrollY; renderResult(); window.scrollTo(0,y); });
  $('#again').onclick = reset;
}
function reviewHTML(q,i,g){
  const a = S.answers[q.no];
  const e = ELEM[q.elemen]||{c:'var(--brand)'};
  let body='', kunciTxt='';
  if(q.tipe==='kategori'){
    kunciTxt = q.kunci.map(k=>k?'Benar':'Salah').join(' – ');
    body = `<div class="ropts">`+q.pernyataan.map((t,j)=>{
      const mine = a&&a[j]; const has = mine===0||mine===1; const right = has && mine===q.kunci[j];
      return `<div class="ropt ${right?'key':(has?'wrong':'')}"><span class="l">${j+1}</span><span>${esc(t)}<br><small>Kunci: <b>${q.kunci[j]?'Benar':'Salah'}</b> · Jawabanmu: <b>${has?(mine?'Benar':'Salah'):'—'}</b></small></span><span class="m">${right?'✓ Tepat':(has?'✗ Keliru':'Kosong')}</span></div>`;
    }).join('')+`</div>`;
  } else {
    const keys = q.tipe==='pg' ? [q.kunci] : q.kunci;
    const mine = q.tipe==='pg' ? (a?[a]:[]) : (a||[]);
    kunciTxt = keys.join(', ');
    body = `<div class="ropts">`+Object.entries(q.opsi).map(([l,t])=>{
      const isK = keys.includes(l), isM = mine.includes(l);
      const cls = isK ? 'key' : (isM ? 'wrong' : '');
      const mark = isK && isM ? '✓ Kunci · dipilih' : isK ? 'Kunci' : isM ? '✗ Dipilih' : '';
      return `<div class="ropt ${cls}"><span class="l">${l}</span><span>${esc(t)}</span><span class="m">${mark}</span></div>`;
    }).join('')+`</div>`;
  }
  const pts = g.pts%1 ? g.pts.toFixed(2) : g.pts;
  return `<article class="rev s-${g.st}">
    <div class="qhead"><span class="qno num">Soal ${i+1}</span><span class="tag" style="--c:${e.c}">${esc(elLabel(q.elemen))}</span><span class="badge">${ST[g.st]}</span><span class="pts num">${pts} / 1</span></div>
    <p class="stem">${esc(q.soal)}</p>
    ${body}
    <div class="bahas"><h4>Pembahasan · Kunci: <span class="kunci">${esc(kunciTxt)}</span></h4><p>${esc(q.pembahasan)}</p></div>
  </article>`;
}

/* ---------- Mulai ---------- */
function render(){
  if(S.phase==='quiz' && Date.now()>=S.endAt){ S.phase='result'; S.finishedAt = S.endAt; save(); }
  if(S.phase==='quiz') renderQuiz(); else if(S.phase==='result') renderResult(); else renderStart();
}
$('#themeBtn').onclick = ()=>{
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
};
load(); useSet(S.set); render();
</script>

</body></html>
