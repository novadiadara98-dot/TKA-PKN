<script>
const SETS = {1: [{"no": 1, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menganalisis peran Pancasila dalam menyeimbangkan hak dan kewajiban warga negara", "pembahasan": "Soal menanyakan peran Pancasila dalam menyeimbangkan hak dan kewajiban. Ilustrasi memuat dua kepentingan yang bertabrakan (pedagang dan pengguna jalan). Pancasila berperan menyelaraskan keduanya sehingga tercipta harmoni sosial dengan hak dan kewajiban yang seimbang. Pilihan lain hanya menekankan satu sisi atau bersifat teknis.", "soal": "Kepentingan pedagang dan pengguna jalan sangat berbeda; pedagang ingin meningkatkan pendapatan dan menjual produk, sementara pengguna jalan membutuhkan kelancaran dan keamanan pergerakan di jalan umum. Namun, berjualan di fasilitas jalan seperti trotoar atau badan jalan dapat mengganggu fungsi jalan, membahayakan keselamatan, dan melanggar hukum. Peran Pancasila dalam memastikan bahwa semua individu memiliki akses yang sama terhadap keadilan berdasarkan ilustrasi tersebut adalah ....", "opsi": {"A": "memberi panduan kepada pedagang cara berjualan yang dapat menjamin hak mendapatkan penghidupan yang layak", "B": "mengarahkan pedagang dan pengguna jalan agar mengutamakan kepentingan bersama setelah kepentingan pribadi terlaksana", "C": "mengingatkan pentingnya kebersamaan dalam menjamin rasa keadilan dan keseimbangan antara hak dan kewajiban", "D": "mengupayakan agar kegiatan pedagang mengutamakan kepentingan pengguna jalan untuk kenyamanan dan ketertiban", "E": "menyelaraskan dua kepentingan untuk menciptakan harmoni sosial yang mengedepankan keseimbangan hak dan kewajiban"}, "kunci": "E"}, {"no": 2, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Memberikan contoh hak/kewajiban warga negara yang mencerminkan salah satu pasal UUD NRI Tahun 1945", "pembahasan": "Pasal 27 ayat (3) mengatur hak dan kewajiban dalam pembelaan negara. Hak warga negara yang sejalan adalah memperoleh perlindungan negara, sedangkan kewajibannya ikut menjaga keamanan dan kedaulatan bangsa. Pilihan lain berkaitan dengan hal sosial, pendidikan, atau ketertiban, bukan pembelaan negara.", "soal": "Pasal 27 ayat (3) UUD NRI Tahun 1945 menyatakan bahwa \"Setiap warga negara berhak dan wajib ikut serta dalam upaya pembelaan negara.\" Berdasarkan ilustrasi, hak warga negara yang mencerminkan pasal tersebut yaitu warga negara berhak ....", "opsi": {"A": "mengikuti kegiatan sosial dan wajib mematuhi peraturan yang ditetapkan oleh pemerintah dalam lingkungannya", "B": "memperoleh pendidikan dan wajib menerapkan nilai-nilai kebangsaan dalam kehidupan sehari-hari", "C": "menyampaikan aspirasi kepada pemerintah dan wajib menaati aturan hukum yang berlaku di masyarakat", "D": "terlibat dalam kegiatan kemasyarakatan dan wajib ikut menjaga ketertiban serta ketentraman lingkungan sekitarnya", "E": "memperoleh perlindungan negara dan wajib ikut berpartisipasi menjaga keamanan serta kedaulatan bangsa"}, "kunci": "E"}, {"no": 3, "tipe": "mcma", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menentukan sikap positif yang dapat dijadikan modal sosial untuk pembangunan nasional", "pembahasan": "Sikap positif sebagai modal sosial adalah sikap yang memperkuat kebersamaan dalam keberagaman: aktif dalam pertukaran budaya dan belajar budaya lain (A), berkomunikasi secara wajar dan menjaga kenyamanan (B), serta menghormati simbol adat dan agama daerah lain (C). Pilihan D hanya berupa membagikan pengalaman di media sosial dan E berfokus pada percepatan keputusan, sehingga tidak langsung menunjukkan sikap positif terhadap keberagaman.", "soal": "Pemerintah terus mendorong harmoni dalam keberagaman melalui berbagai program. Salah satunya adalah Festival Toleransi dan Budaya Pelajar yang melibatkan siswa SMA dari berbagai daerah. Kegiatan ini meliputi pertukaran budaya, pameran kearifan lokal, dan diskusi lintas suku, agama, serta bahasa. Berdasarkan informasi tersebut, pernyataan mana saja yang menunjukkan sikap positif sebagai modal sosial untuk pembangunan nasional?", "opsi": {"A": "terlibat secara aktif dalam pertukaran budaya dan belajar mengenali keunikan budaya yang lain", "B": "menjalin komunikasi secara wajar dengan tetap menjaga kenyamanan dalam keberagaman budaya", "C": "menghormati simbol-simbol dari berbagai adat dan agama saat berkunjung ke daerah-daerah lain", "D": "membagikan pengalaman kegiatan lintas budaya di media sosial sebagai inspirasi untuk masyarakat", "E": "menyampaikan pendapat dengan hati-hati saat melakukan diskusi agar keputusan segera terwujud"}, "kunci": ["A", "B", "C"]}, {"no": 4, "tipe": "pg", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menganalisis upaya untuk melindungi keutuhan NKRI dari dampak negatif ideologi tersebut", "pembahasan": "Radikalisme di media sosial paling efektif dicegah lewat upaya preventif dan edukatif: penguatan pendidikan Pancasila, literasi digital, dan pelibatan tokoh agama. Dialog dengan kelompok radikal (A) tidak tepat karena ideologinya bertentangan dengan dasar negara. Pengawasan dan teguran (C) serta kampanye (D) bersifat represif atau sementara, dan forum diskusi (E) kurang menyentuh akar masalah.", "soal": "Penyebaran paham radikalisme di media sosial untuk merubah ideologi negara semakin marak terjadi. Hal ini memengaruhi generasi muda dan menciptakan konflik horizontal di masyarakat. Upaya terbaik untuk melindungi keutuhan NKRI dari dampak tersebut adalah...", "opsi": {"A": "mengadakan dialog terbuka dengan kelompok radikal untuk mencari titik temu dan mengurangi konflik ideologi", "B": "memperkuat pendidikan Pancasila dan literasi digital di sekolah serta melibatkan tokoh agama dalam edukasi masyarakat", "C": "meningkatkan pengawasan ketat terhadap aktivitas media sosial dan memberikan teguran bagi penyebar konten radikal", "D": "mengorganisir kampanye nasional anti radikalisme melalui berbagai platform media untuk membentuk opini publik", "E": "membentuk forum diskusi antargenerasi untuk membahas perbedaan pandangan ideologi secara demokratis"}, "kunci": "B"}, {"no": 5, "tipe": "pg", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menganalisis cara warga negara dalam mengatasi tantangan indonesia dalam menjaga keutuhan NKRI", "pembahasan": "Tantangan disintegrasi dipicu ketidakadilan, diskriminasi, dan hoaks. Cara warga negara menjawabnya adalah menyebarkan informasi yang benar (melawan hoaks) dan membangun dialog antarkelompok (mencegah konflik). Pilihan A membatasi budaya luar, C membentuk kelompok homogen (justru memecah), D hanya membela satu kelompok, dan E bersifat pasif.", "soal": "Indonesia sebagai negara kepulauan yang multietnis menghadapi tantangan disintegrasi yang sering dipicu oleh isu ketidakadilan, diskriminasi, dan penyebaran hoaks. Cara warga negara dalam mengatasi tantangan tersebut dapat dilakukan dengan ....", "opsi": {"A": "mengajak masyarakat menjaga budaya lokal dengan membatasi pengaruh budaya luar yang masuk", "B": "menyebarkan informasi yang benar dan membangun dialog antarkelompok untuk mencegah konflik", "C": "mendorong pembentukan kelompok sosial yang terdiri dari warga dengan latar belakang yang sama", "D": "berpartisipasi dalam diskusi di media sosial dengan menyuarakan pandangan kelompok minoritas", "E": "meminimalkan pernyataan atau aktivitas yang dapat menimbulkan gesekan antarkelompok di masyarakat"}, "kunci": "B"}, {"no": 6, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menganalisis pentingnya Pancasila sebagai dasar negara dalam memecahkan masalah pada peristiwa ketatanegaraan di Indonesia", "pembahasan": "Perdebatan amandemen mengenai sistem pemilihan presiden harus dipertimbangkan dengan Pancasila sebagai dasar negara, yaitu memastikan kedaulatan rakyat (sila keempat) dan keadilan sosial (sila kelima) tetap terjamin. Pilihan B sampai E menyebut Pancasila sebagai alat hukum teknis atau acuan satu lembaga, padahal Pancasila adalah sumber dari segala sumber hukum, bukan alat salah satu lembaga.", "soal": "Terjadi perdebatan sengit di masyarakat dan parlemen terkait wacana amandemen UUD 1945 di mana sebagian pihak mengusulkan agar pemilihan presiden dikembalikan ke MPR, sedangkan sebagian lain ingin mempertahankan sistem pemilihan langsung oleh rakyat. Ketegangan ini menimbulkan kekhawatiran akan mundurnya demokrasi di Indonesia. Berdasarkan ilustrasi, pentingnya Pancasila untuk memecahkan masalah tersebut karena ....", "opsi": {"A": "menjadi dasar mempertimbangkan setiap perubahan agar tetap menjamin kedaulatan rakyat dan keadilan sosial secara seimbang", "B": "digunakan sebagai alat hukum tertinggi Indonesia agar perubahan aturan tidak menyalahi sistem pemerintahan yang sudah berlaku", "C": "menjadi acuan teknis lembaga legislatif di Indonesia dalam menentukan batasan perubahan agar tidak melewati kewenangan politik", "D": "digunakan oleh lembaga eksekutif agar pelaksanaan pemerintahan di Indonesia tetap stabil di tengah konflik politik yang terjadi", "E": "dijadikan dasar keputusan oleh lembaga yudikatif untuk menilai apakah usulan perubahan tersebut sesuai kepentingan negara"}, "kunci": "A"}, {"no": 7, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menentukan alasan kerja sama antara pemerintah pusat dengan pemerintah daerah dilakukan", "pembahasan": "Kerja sama pusat dan daerah terjadi karena pembagian peran: pemerintah pusat merancang kebijakan dan program, sedangkan pemerintah daerah melaksanakannya sesuai kondisi setempat. Pilihan A menjelaskan alasan tersebut. Pilihan B, C, D, dan E hanya menjelaskan apa yang dilakukan pemerintah daerah, bukan alasan adanya kerja sama.", "soal": "Salah satu bentuk kerja sama antara pemerintah pusat dan pemerintah daerah adalah dalam hal Penanggulangan Kemiskinan. Kerja sama dalam penanggulangan kemiskinan melibatkan pemerintah pusat yang memberikan kebijakan dan program, sementara pemerintah daerah melaksanakan program tersebut di tingkat daerah termasuk bantuan sosial, pelatihan, dan pengembangan usaha mikro. Bentuk kerja sama ini dilakukan karena ...", "opsi": {"A": "Pemerintah pusat mengembangkan program-program yang dapat diimplementasikan oleh pemerintah daerah, seperti program pelatihan kerja, bantuan sosial, dan pengembangan ekonomi lokal", "B": "Pemerintah daerah dapat mengembangkan ekonomi lokal dengan menciptakan lapangan kerja, mendukung usaha kecil dan menengah, serta meningkatkan infrastruktur", "C": "Pemerintah daerah dapat menyediakan program bantuan sosial seperti bantuan pangan, bantuan biaya pendidikan, dan bantuan kesehatan untuk masyarakat miskin.", "D": "Pemerintah daerah dapat mengidentifikasi dan memetakan kemiskinan di daerahnya, sehingga dapat mengajukan permohonan bantuan kepada pemerintah pusat untuk mengatasinya", "E": "Pemerintah daerah dapat meningkatkan kapasitas masyarakat melalui pelatihan dan pendidikan, sehingga masyarakat dapat meningkatkan keterampilan dan kemampuan mereka"}, "kunci": "A"}, {"no": 8, "tipe": "mcma", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menjelaskan tujuan integrasi nasional dalam bingkai Bhinneka Tunggal Ika sesuai dengan ilustrasi keberagaman", "pembahasan": "Tujuan integrasi nasional dalam bingkai Bhinneka Tunggal Ika adalah membangun persatuan dan kesatuan bangsa agar hidup harmonis (A), meningkatkan kerja sama antarpemeluk agama dan suku (D), dan memperkuat identitas nasional serta rasa cinta tanah air (E). Pilihan B (kualitas hidup melalui pembangunan) dan C (disegani di dunia internasional) merupakan tujuan pembangunan atau politik luar negeri, bukan tujuan integrasi nasional yang berangkat dari ilustrasi keberagaman.", "soal": "Keberagaman bangsa Indonesia merupakan salah satu kekuatan dan kekayaan bangsa, namun juga dapat menjadi tantangan dalam membangun kesatuan dan persatuan. Oleh karena itu, penting untuk meningkatkan sikap toleransi, saling menghormati, dan kerja sama antaretnis dan agama. Berdasarkan ilustrasi tersebut, Pernyataan mana saja yang menjelaskan tujuan integrasi nasional dalam bingkai Bhinneka Tunggal Ika?", "opsi": {"A": "Integrasi bangsa Indonesia bertujuan untuk membangun kesatuan dan persatuan bangsa, sehingga masyarakat Indonesia dapat hidup harmonis dan sejahtera", "B": "Integrasi bangsa Indonesia bertujuan untuk meningkatkan kualitas hidup masyarakat Indonesia melalui pembangunan ekonomi, pendidikan, dan kesehatan", "C": "Integrasi Bangsa Indonesia bertujuan untuk menjadikan bangsa Indonesia menjadi Negara yang kuat dan bangsa yang disegani dalam percaturan internasional", "D": "Integrasi yang berasal dari kebinekaan bangsa Indonesia bertujuan meningkatkan kerjasama antarpemeluk agama dan suku bangsa sehingga tercipta bangsa yang besar", "E": "Integrasi nasional Indonesia bertujuan mengembangkan identitas nasional yang kuat dan bangga, sehingga masyarakat Indonesia dapat memiliki rasa kebanggaan dan cinta tanah air"}, "kunci": ["A", "D", "E"]}, {"no": 9, "tipe": "pg", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menganalisis pentingnya salah satu nilai gatra pada wawasan nusantara dalam menjaga keutuhan NKRI", "pembahasan": "Gatra ekonomi dalam wawasan nusantara mengamanatkan demokrasi ekonomi, yaitu ekonomi dari, oleh, dan untuk rakyat. Maka pentingnya bagi keutuhan NKRI adalah melibatkan potensi dan partisipasi seluruh masyarakat, bukan hanya pihak tertentu. Pilihan lain (eksploitasi, pemerataan, kemandirian) tidak langsung menjawab prinsip demokrasi ekonomi yang disebut dalam ilustrasi.", "soal": "Panca gatra adalah aspek sosial kemasyarakatan dalam wawasan nusantara yang bersifat dinamis meliputi ideologi, politik, ekonomi, sosial budaya dan pertahanan keamanan. Gatra ekonomi sebagai salah satu aspek dalam wawasan nusantara merujuk pada aspek ekonomi yang menjadi bagian integral dari cara pandang bangsa Indonesia terhadap wilayah dan potensi negaranya. Wawasan nusantara dalam bidang ekonomi juga mengamanatkan pelaksanaan demokrasi ekonomi. Pentingnya hal tersebut dalam menjaga keutuhan NKRI adalah ....", "opsi": {"A": "mewujudkan pembangunan yang menjamin terwujudnya pemerataan pendapatan", "B": "mendorong untuk terus mengembangkan kehidupan ekonomi yang kuat dan mandiri", "C": "menekankan pentingnya eksplorasi dan eksploitasi potensi ekonomi antardaerah di Indonesia", "D": "melibatkan potensi dan partisipasi dari seluruh masyarakat, bukan hanya pihak tertentu", "E": "mengeksplorasi seluruh kekayaan alam dan potensi ekonomi strategis Indonesia"}, "kunci": "D"}, {"no": 10, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menentukan respons perilaku yang mencerminkan hak asasi manusia sesuai dengan sila Pancasila", "pembahasan": "Sila keempat menekankan kerakyatan, musyawarah, dan penghargaan pada perbedaan pendapat. Dalam pemilu, perilaku yang mencerminkan hak asasi sesuai sila ini adalah menghormati perbedaan pendapat dan pilihan politik. Pilihan A (mengikuti arahan partai) justru mengurangi kebebasan memilih, sedangkan C, D, dan E tidak mencerminkan penghormatan terhadap hak orang lain.", "soal": "Dalam negara demokrasi, pemilihan umum merupakan sarana utama mewujudkan kedaulatan rakyat. Pemilu merupakan proses penting dalam sistem demokrasi yang memungkinkan rakyat untuk memilih wakil-wakil mereka dalam pemerintahan. Perilaku yang mencerminkan hak asasi manusia sesuai dengan sila keempat Pancasila berdasarkan ilustrasi tersebut adalah ....", "opsi": {"A": "menggunakan hak pilih sesuai dengan arah kebijakan dari partai politik", "B": "menghormati perbedaan pendapat dan pilihan politik dalam masyarakat", "C": "berpartisipasi aktif dengan cara mengikuti kampanye seluruh partai politik", "D": "mengikuti debat dalam pemilu untuk menilai strategi pemenangan para kandidat", "E": "menerima hasil dari setiap tahapan pemilu karena pelaksanaannya di awasi negara"}, "kunci": "B"}, {"no": 11, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menganalisis cara menyelesaikan permasalahan dalam sistem ketatanegaraan dikaitkan dengan kewenangan lembaga negara Indonesia", "pembahasan": "Sengketa hasil pilkada diselesaikan oleh Mahkamah Konstitusi, yang berwenang memutus perselisihan hasil pemilihan umum, termasuk pemilihan kepala daerah. Presiden, KPU, Bawaslu, dan DPRD tidak berwenang memutus sengketa hasil.", "soal": "Dalam pelaksanaan Pilkada Serentak tahun 2024 lalu, terjadi perselisihan hasil penghitungan suara salah satu daerah. Dua pasangan calon saling mengklaim kemenangan, sementara rekapitulasi suara oleh KPU daerah dituding tidak transparan. Salah satu pasangan calon kemudian menggugat hasil Pilkada tersebut karena diduga terjadi kecurangan yang bersifat terstruktur, sistematis, dan masif (TSM) yang dapat memengaruhi hasil akhir pemilihan. Berdasarkan sistem ketatanegaraan Indonesia, cara menyelesaikan permasalahan tersebut sesuai kewenangan lembaga negara adalah ...", "opsi": {"A": "Presiden menetapkan peraturan pemerintah untuk mengatur ketentuan penyelesaian perbedaan penghitungan suara", "B": "Mahkamah Konstitusi melaksanakan kewenangannya dengan memutus perselisihan tentang hasil pemilukada", "C": "Komisi Pemilihan Umum membuat aturan internal tentang penyelesaian perselisihan hasil perhitungan suara pemilukada", "D": "Badan Pengawas Pemilihan Umum memerintahkan dilakukannya pemungutan suara ulang untuk kepastian hasil", "E": "DPRD bersama Pemerintah Daerah membuat peraturan daerah yang mengatur pemilukada yang lebih lengkap"}, "kunci": "B"}, {"no": 12, "tipe": "pg", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menganalisis upaya untuk mencegah/menghadapi ancaman terhadap integrasi nasional", "pembahasan": "Diskriminasi dapat diatasi dengan membangun komunikasi dan dialog antarwarga untuk menumbuhkan saling pengertian serta mencegah prasangka. Pilihan A, B, dan D tidak menjawab persoalan diskriminasi (D bahkan membenarkan penempatan orang sesuai posisi sosial), sedangkan E benar sebagai nilai tetapi bersifat prinsip umum, bukan upaya konkret yang paling tepat.", "soal": "Diskriminasi adalah perlakuan yang tidak adil terhadap seseorang atau kelompok berdasarkan perbedaan suku, agama, ras, jenis kelamin, atau status sosial. Apabila dibiarkan, diskriminasi dapat memicu konflik dan menjadi ancaman serius bagi integrasi nasional Indonesia. Berdasarkan ilustrasi, upaya yang perlu dilakukan untuk menghadapi ancaman tersebut agar integrasi nasional tetap terjaga adalah....", "opsi": {"A": "mendorong tumbuhnya semangat memperjuangkan kebebasan individu dalam kehidupan bernegara", "B": "mengajak setiap individu untuk saling mengakui sebagai makhluk yang memiliki kebebasan dan merdeka", "C": "mengutamakan dialog antarwarga untuk memperkuat rasa saling pengertian dan mencegah prasangka", "D": "menempatkan orang lain sesuai posisi sosialnya sebagai bagian dari tatanan masyarakat yang teratur", "E": "menumbuhkan sikap saling menghormati karena setiap manusia memiliki harkat dan martabat yang sama"}, "kunci": "C"}, {"no": 13, "tipe": "kategori", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menjelaskan peran warga negara dalam menjaga keutuhan NKRI berdasarkan dinamika IPOLEKSOSBUDHANKAM", "pembahasan": "Pernyataan 1 Benar: konsumen yang mendukung produk dalam negeri memperkuat ekonomi nasional. Pernyataan 2 Benar: berpartisipasi dalam kegiatan ekonomi yang meningkatkan daya saing menjawab tantangan globalisasi. Pernyataan 3 Salah: membeli produk dalam negeri hanya karena harganya murah tidak didasari kesadaran menjaga keutuhan NKRI, sehingga bukan peran warga negara yang dimaksud.", "soal": "Globalisasi ekonomi mendorong masuknya berbagai produk luar negeri ke pasar Indonesia. Apabila tidak disikapi dengan bijak, hal ini dapat menurunkan daya saing produk lokal dan mengancam perekonomian nasional. Berdasarkan ilustrasi, klik pada pilihan Benar atau Salah dari setiap pernyataan berikut yang menunjukkan peran warga negara dalam menjaga keutuhan NKRI berdasarkan dinamika tersebut!", "pernyataan": ["berperan sebagai konsumen yang mendukung produk dalam negeri untuk memperkuat perekonomian nasional", "berpartisipasi dalam kegiatan ekonomi yang mendorong daya saing bangsa di tengah arus globalisasi", "berpatisipasi dengan membeli produk-produk dalam negeri karena memiliki harga lebih murah"], "kunci": [1, 1, 0]}, {"no": 14, "tipe": "pg", "elemen": "Pancasila", "indikator": "Mengidentifikasi perilaku yang berkaitan dengan antarSila dalam Pancasila", "pembahasan": "Menghormati perbedaan pendapat berkaitan dengan sila kedua (menghargai orang lain secara beradab) sekaligus sila keempat (musyawarah), dan bekerja sama menyelesaikan tugas kelompok adalah wujud keduanya. Pilihan B lebih ke sila kedua dan kelima, C ke sila ketiga dan kelima, D ke sila keempat dan kelima, dan E ke sila kedua dan pertama atau ketiga.", "soal": "Bunyi sila kedua dan keempat Pancasila yaitu \"Kemanusiaan yang Adil dan Beradab\" dan \"Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan Perwakilan\". Perilaku yang berhubungan dengan kedua sila Pancasila tersebut adalah ...", "opsi": {"A": "menghormati perbedaan pendapat teman dan bekerja sama untuk menyelesaikan tugas kelompok dengan baik", "B": "memberikan perlakuan yang sama kepada semua orang tanpa membeda-bedakan latar belakang suku dan agama", "C": "bekerja sama dengan warga lain untuk membangun fasilitas umum yang dapat dinikmati oleh seluruh masyarakat", "D": "memberikan bantuan kepada korban banjir suatu daerah berdasarkan hasil musyawarah seluruh warga kampung", "E": "menghormati hak asasi manusia dengan bersikap adil dan beradab kepada sesama antarumat beragama"}, "kunci": "A"}, {"no": 15, "tipe": "kategori", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menjelaskan kewenangan lembaga negara", "pembahasan": "Pernyataan 1 Benar: MK memutus pendapat DPR mengenai dugaan pelanggaran oleh Presiden dan/atau Wakil Presiden (Pasal 24C UUD 1945). Pernyataan 2 Salah: menguji peraturan di bawah undang-undang terhadap undang-undang adalah wewenang Mahkamah Agung, sedangkan MK menguji undang-undang terhadap UUD. Pernyataan 3 Salah: pelantikan Presiden dan Wakil Presiden dilakukan oleh MPR, bukan MK.", "soal": "Mahkamah Konstitusi (MK) adalah lembaga negara yang mempunyai wewenang sebagaimana di atur dalam Undang-Undang Dasar Negara RI Tahun 1945 . Klik pada pilihan Benar atau Salah dari setiap pernyataan berikut berkaitan dengan Wewenang Mahkamah Konstitusi!", "pernyataan": ["memutuskan pendapat DPR mengenai dugaan pelanggaran oleh Presiden dan Wakil Presiden", "menguji peraturan perundang-undangan di bawah undang-undang terhadap undang-undang", "mengganti dan sekaligus melantik Presiden dan/atau Wakil Presiden dalam masa jabatannya"], "kunci": [1, 0, 0]}, {"no": 16, "tipe": "kategori", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menjelaskan upaya menjaga integrasi nasional dalam bingkai kebhinekaan", "pembahasan": "Pernyataan 1 Benar: melindungi hak asasi semua warga tanpa diskriminasi menjaga integrasi. Pernyataan 2 Benar: menangani potensi konflik dan memperkuat kerja sama menjaga persatuan. Pernyataan 3 Salah: dialog antarkelompok bertujuan saling memahami dan menghargai, bukan menyesuaikan diri dengan budaya lain, sebab kebinekaan harus dipertahankan, bukan dihilangkan.", "soal": "Bangsa Indonesia adalah bangsa yang memiliki keberagaman suku, agama, bahasa, adat istiadat, dan budaya yang hidup berdampingan. Kebinekaan dapat menjadi fondasi kokoh yang menopang persatuan dan kesatuan bangsa. Namun adanya perbedaan juga dapat menjadi ancaman persatuan dan kesatuan. Klik Benar atau Salah dari setiap pernyataan berikut yang menunjukkan upaya menjaga integrasi nasional dalam bingkai kebhinekaan!", "pernyataan": ["menghormati dan melindungi hak asasi manusia untuk semua warga negara, tanpa membedakan latar belakang budaya, agama, atau suku bangsa", "mengawasi dan menangani konflik yang berpotensi mengancam integrasi nasional, serta meningkatkan kerja sama antarlembaga dan masyarakat", "meningkatkan dialog dan komunikasi antarkelompok masyarakat untuk memperkuat persatuan bangsa dengan menyesuaikan perkembangan budaya lain"], "kunci": [1, 1, 0]}, {"no": 17, "tipe": "kategori", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menunjukkan bukti bahwa Bhinneka Tunggal Ika dapat mengatasi ancaman dalam perkembangan kehidupan global.", "pembahasan": "Pernyataan 1 Salah: Bhinneka Tunggal Ika mengakui perbedaan, bukan menghilangkannya. Pernyataan 2 Benar: penghormatan terhadap perbedaan mengurangi konflik dan memperkuat persatuan. Pernyataan 3 Benar: kesadaran akan keberagaman dan kesatuan meningkatkan partisipasi dan kontribusi membangun masyarakat global.", "soal": "Perubahan iklim dan lingkungan merupakan salah satu bagian dalam perkembangan masyarakat global yang dapat mengancam keberlangsungan hidup manusia dan ekosistem serta menciptakan ketidakstabilan sosial, ekonomi dan politik yang kerap memunculkan terjadinya konflik dalam masyarakat. Klik pada pilihan Benar atau Salah dari setiap pernyataan berikut yang menunjukkan bukti bahwa Bhinneka Tunggal Ika dapat mengatasi ancaman sebagaimana ilustrasi diatas!", "pernyataan": ["Bhinneka Tunggal Ika merupakan semboyan persatuan dan kesatuan yang mengakui persamaan suku, agama, bahasa, dan budaya serta identitas nasional dengan menghilangkan segala bentuk perbedaan", "Bhinneka Tunggal Ika meningkatkan penghormatan dan penghargaan terhadap perbedaan, sehingga dapat mengurangi konflik dan meningkatkan kesatuan dan persatuan sebagai bagian masyarakat global", "Bhinneka Tunggal Ika meningkatkan kesadaran terhadap keberagaman dan kesatuan, sehingga dapat meningkatkan partisipasi dan kontribusi masyarakat dalam membangun masyarakat global yang dinamis"], "kunci": [0, 1, 1]}, {"no": 18, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menentukan nilai Pancasila yang diterapkan/dilanggar pada peristiwa pelaksanaan/pelanggaran hak asasi manusia.", "pembahasan": "Ilustrasi menunjukkan warga yang berbeda agama, budaya, dan latar belakang tetapi tetap hidup rukun, saling menghargai, dan tertib. Nilai yang paling tepat adalah Persatuan, karena perbedaan tidak menjadi penghalang hidup harmonis. Pilihan lain menambahkan hal yang tidak disebut ilustrasi (ibadah, saling membantu, pemerataan fasilitas).", "soal": "Warga di sebuah lingkungan perumahan hidup berdampingan dalam keberagaman agama, budaya, dan latar belakang sosial. Mereka saling menghargai, aktif dalam kegiatan sosial bersama, dan menjaga ketertiban dengan mematuhi aturan yang berlaku. Berdasarkan ilustrasi, nilai Pancasila yang paling tepat telah diterapkan pada kondisi tersebut adalah ....", "opsi": {"A": "Nilai Ketuhanan, karena setiap warga dapat menjalankan ibadah sesuai agama dan keyakinannya", "B": "Nilai Kemanusiaan, karena masyarakat saling membantu tanpa memandang latar belakangnya", "C": "Nilai Persatuan, karena perbedaan yang ada tidak menjadi penghalang untuk hidup rukun dan harmonis", "D": "Nilai Persatuan, karena warga berpartisipasi dalam kegiatan sosial sesuai peran kelompok budayanya", "E": "Nilai Keadilan Sosial, karena semua warga mendapatkan hak dan fasilitas secara merata tanpa kecuali"}, "kunci": "C"}, {"no": 19, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menentukan solusi dalam mengatasi pelanggaran hak/pengingkaran kewajiban warga negara.", "pembahasan": "Konflik antara pedagang dan pihak lain yang saling merasa dirugikan paling tepat diselesaikan lewat mediasi, sehingga semua pihak memahami hak dan kewajibannya. Pilihan lain bersifat sepihak (mewakilkan, mengumpulkan dukungan, advokasi) dan belum menyelesaikan akar masalah, yaitu tidak adanya kesepakatan ganti rugi.", "soal": "Sekelompok pedagang kecil mengalami masalah karena tempat mereka mencari nafkah tiba-tiba dilarang digunakan. Hal ini terjadi tanpa kesepakatan ganti rugi, sehingga mereka merasa telah terjadi pelanggaran hak dan pengingkaran kewajiban untuk saling menghormati kepentingan masing-masing. Berdasarkan ilustrasi, solusi untuk mengatasi pelanggaran tersebut yaitu ....", "opsi": {"A": "mengirim perwakilan pedagang untuk menyampaikan usulan agar memperoleh tempat pengganti untuk berjualan", "B": "mengumpulkan dukungan dari elemen masyarakat sebagai upaya mempertahankan haknya untuk berjualan", "C": "melakukan mediasi sehingga para pihak memahami hak dan kewajibannya yang melandasi kepentingannya", "D": "mengajukan advokasi kepada lembaga bantuan hukum untuk memastikan para pedagang berada di pihak yang benar", "E": "mewakilkan kepada lembaga swadaya masyarakat untuk membantu memperjuangkan hak-hak sebagai pengguna lahan"}, "kunci": "C"}, {"no": 20, "tipe": "pg", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menganalisis tantangan/hambatan yang dihadapi dalam menjaga integrasi nasional dalam bingkai \"Bhinneka Tunggal Ika\".", "pembahasan": "Dari ilustrasi, banyaknya suku bangsa dengan tradisi dan adat berbeda dapat memunculkan sukuisme, yaitu sikap menganggap suku sendiri paling unggul, sehingga menghambat integrasi nasional. Pilihan lain (ketimpangan, rendah diri, kepunahan, modernisme) tidak langsung bersumber dari keberagaman suku bangsa.", "soal": "Kehidupan suku bangsa di Indonesia sangat kaya akan keberagaman, dipengaruhi oleh faktor geografis dan sejarah. Indonesia memiliki lebih dari 1.340 suku bangsa yang tersebar di berbagai pulau, masing-masing dengan bahasa, tradisi, dan adat istiadat yang unik. Berdasarkan ilustrasi, tantangan yang dihadapi dalam menjaga integrasi nasional dalam bingkai \"Bhinneka Tunggal Ika\" adalah ....", "opsi": {"A": "adanya ketimpangan kehidupan yang terjadi dalam masyarakat", "B": "munculnya sikap sukuisme dalam kehidupan bermasyarakat", "C": "hadirnya perasaan rendah diri suku tertentu dalam masyarakat", "D": "terjadinya kepunahan suku tertentu akibat kesenjangan sosial", "E": "munculnya perilaku modernisme suku tertentu yang berlebihan"}, "kunci": "B"}, {"no": 22, "tipe": "kategori", "elemen": "Pancasila", "indikator": "Menentukan fungsi diterapkannya Pancasila dalam pergaulan kehidupan global tersebut", "pembahasan": "Pernyataan 1 dan 2 Benar: nilai toleransi, persatuan, dan keadilan menjadi landasan hubungan serta kerja sama internasional yang harmonis dan berkeadilan. Pernyataan 3 Salah: ilustrasi hanya menyebut potensi Indonesia menjadi role model kerukunan, sedangkan klaim bahwa penerapan Pancasila meningkatkan derajat sebagai bangsa yang unggul merupakan klaim berlebihan dan bukan fungsi penerapan Pancasila.", "soal": "Perkembangan global menyebabkan Pancasila menjadi representasi dari keberagaman masyarakat dunia. Pancasila dengan nilai-nilai toleransi, persatuan, dan keadilan, menjadi solusi universal dalam mengatasi tantangan perbedaan budaya dan agama di dunia. Kondisi tersebut berpotensi menjadikan bangsa Indonesia sebagai role model dalam mempromosikan kerukunan dan harmoni dari keberagaman masyarakat dunia. Klik pada pilihan benar atau salah dari setiap pernyataan berikut terkait fungsi dari diterapkannya Pancasila dalam pergaulan kehidupan global berdasarkan ilustrasi tersebut !", "pernyataan": ["Pancasila dapat menjadi landasan untuk meningkatkan hubungan internasional yang harmonis dan berkeadilan", "Pancasila dapat menjadi landasan untuk membangun kerja sama internasional yang efektif dan berkeadilan", "Implementasi Pancasila di era global dapat meningkatkan derajat Indonesia sebagai bangsa yang unggul di dunia"], "kunci": [1, 1, 0]}, {"no": 23, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menjelaskan tantangan yang dihadapi dalam mengimplementasikan salah satu Pasal UUD NRI Tahun 1945", "pembahasan": "Pasal 27 ayat (2) menjamin hak atas pekerjaan dan penghidupan layak. Tantangan nyata pelaksanaannya adalah keterbatasan akses terhadap pekerjaan akibat ketidaksetaraan dan infrastruktur yang belum merata. Pilihan C keliru karena tingkat keterampilan yang merata dan setara bukan hambatan, dan pilihan lain tidak berkaitan langsung dengan akses terhadap pekerjaan.", "soal": "Pasal 27 ayat (2) UUD NRI Tahun 1945 menyatakan bahwa tiap-tiap warga negara berhak atas pekerjaan dan penghidupan yang layak bagi kemanusiaan. Tantangan yang dihadapi dalam mengimplementasikan pasal tersebut adalah ....", "opsi": {"A": "penyusunan regulasi di bidang ketenagakerjaan yang membutuhkan waktu yang lama", "B": "adanya keterbatasan akses terhadap pekerjaan akibat ketidaksetaraan dan infrastruktur", "C": "tingkat keterampilan dan pendidikan di kalangan pencari kerja yang merata dan setara", "D": "adanya perbedaan standar kualitas pekerja yang berbeda-beda dari pemberi kerja", "E": "lemahnya perlindungan hukum yang diberikan oleh negara kepada pekerja anak"}, "kunci": "B"}, {"no": 24, "tipe": "pg", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menentukan latar belakang suatu peristiwa/aktivitas dapat menjadi modal sosial pembangunan Indonesia", "pembahasan": "Modal sosial berkaitan dengan identitas, kebersamaan, dan rasa memiliki. Pelestarian Reog menjadikan kebudayaan sebagai identitas pembangunan bangsa di tengah gempuran budaya asing, sehingga kuat sebagai modal sosial. Pilihan A, B, dan E menekankan manfaat ekonomi atau pengakuan internasional, sedangkan D membalik hubungan antara pembangunan dan budaya.", "soal": "Reog Ponorogo merupakan bagian tak terpisahkan dari kehidupan budaya masyarakat Ponorogo, Jawa Timur. Seiring perkembangannya, Reog tidak hanya menjadi simbol budaya masyarakat Ponorogo, tetapi juga bagian dari identitas budaya nasional Indonesia. Pada tahun 2024, Reog Ponorogo resmi diakui sebagai warisan budaya takbenda oleh UNESCO, sebagai langkah penting dalam pelestarian warisan budaya bangsa dan menjadi modal sosial pembangunan Indonesia. Alasan pelestarian Reog Ponorogo menjadi modal sosial pembangunan Indonesia adalah ....", "opsi": {"A": "tradisi lokal memperkuat promosi pariwisata untuk peningkatan ekonomi nasional", "B": "identitas budaya daerah yang diakui secara internasional mendatangkan modal pembangunan", "C": "kebudayaan menjadi identitas pembangunan bangsa di tengah maraknya gempuran budaya asing", "D": "pembangunan nasional membutuhkan identitas budaya lokal dalam menentukan prioritas pembangunan", "E": "pengakuan warisan budaya oleh UNESCO dapat menjadi modal pembangunan yang diakui dunia internasional"}, "kunci": "C"}, {"no": 25, "tipe": "pg", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menentukan alasan suatu aktivitas/peristiwa dapat memperkukuh persatuan dan kesatuan bangsa", "pembahasan": "Festival Budaya Nusantara mempertemukan berbagai komunitas dan menampilkan keberagaman budaya sehingga mempererat hubungan antarwarga negara, yang memperkukuh persatuan dan kesatuan. Pilihan lain menekankan manfaat ekonomi dan pariwisata.", "soal": "Pemerintah Indonesia mengadakan kegiatan Festival Budaya Nusantara yang melibatkan berbagai komunitas dari seluruh provinsi. Kegiatan ini mencakup pameran seni, pertunjukan tradisional, serta diskusi tentang keberagaman budaya Indonesia. Alasan kegiatan tersebut dapat memperkukuh persatuan dan kesatuan bangsa adalah ....", "opsi": {"A": "memperkenalkan produk lokal untuk meningkatkan perekonomian setiap daerah", "B": "mengedepankan keberagaman budaya Indonesia yang mempererat hubungan antarwarga negara", "C": "menciptakan peluang kerja baru untuk masyarakat yang terlibat dalam pameran dan pertunjukan", "D": "memberi kesempatan kepada wisatawan lokal dan asing untuk menikmati budaya Indonesia", "E": "promosi pariwisata lokal di setiap daerah untuk menarik lebih banyak wisatawan domestik"}, "kunci": "B"}, {"no": 26, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menganalisis peran Pancasila sebagai ideologi negara yang menjadi pemersatu bangsa", "pembahasan": "Untuk konflik antaragama, Pancasila berperan sebagai perekat hubungan umat beragama (mayoritas dan minoritas) serta pemerintah dalam kehidupan bernegara. Pilihan lain menyebut fungsi yang sempit atau tidak sesuai dengan peran ideologi pemersatu (dialog agama, melihat perbedaan paham, menguji solidaritas, menghormati hari besar).", "soal": "Dinamika masyarakat multikultural di Indonesia merupakan interaksi kompleks antarberbagai kelompok etnis, budaya, agama, dan sistem nilai, yang menghasilkan berbagai tantangan. Salah satu permasalahan yang dihadapi masyarakat multikultural di Indonesia adalah konflik antaragama. Peran Pancasila sebagai ideologi negara yang menjadi pemersatu dalam kehidupan berbangsa berdasarkan ilustrasi di atas adalah ...", "opsi": {"A": "sebagai perekat hubungan umat beragama mayoritas dan minoritas serta pemerintah dalam kehidupan bernegara", "B": "menjadi pendorong adanya dialog sesama agama untuk meningkatkan kebersamaan umat dan mengurangi rasa curiga", "C": "menjadi dasar dalam melihat adanya perbedaan paham dari berbagai agama dan aliran kepercayaan dalam masyarakat", "D": "merupakan sarana untuk menguji kepekaan sosial dan rasa solidaritas kelompok dari umat beragama dalam masyarakat", "E": "sebagai dasar untuk menghargai dan menghormati perayaan hari-hari besar berbagai agama dalam masyarakat"}, "kunci": "A"}, {"no": 27, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menentukan tantangan dalam penegakan hukum pada suatu peristiwa", "pembahasan": "Ilustrasi memperlihatkan laporan warga yang diproses lambat dan adanya uang pelicin agar kasus tidak berlanjut. Tantangan utamanya adalah pengaruh kekuasaan dan praktik suap dalam proses hukum. Pilihan lain tidak sesuai: warga sudah melapor (A), perlindungan terhadap pelaku bukan masalah (B), tidak ada penyelesaian kekeluargaan (D), dan kesadaran pengusaha bukan tantangan penegakan hukum (E).", "soal": "Seorang pengusaha membuang limbah pabrik ke sungai yang mengalir di dekat pemukiman warga. Akibatnya, air menjadi tercemar dan banyak warga mengalami gangguan kesehatan. Meskipun masyarakat sudah melaporkan hal ini kepada pihak berwenang, proses hukum berjalan sangat lambat. Bahkan, muncul kabar bahwa perusahaan tersebut memberikan \"uang pelican\" agar kasusnya tidak diproses lebih lanjut. Warga menjadi kecewa dan kehilangan kepercayaan terhadap lembaga penegak hukum. Berdasarkan ilustrasi tersebut, tantangan utama dalam penegakan hukum yang ditunjukkan adalah....", "opsi": {"A": "kurangnya partisipasi masyarakat dalam kegiatan pemeliharaan lingkungan hidup", "B": "lemahnya perlindungan hukum kepada terduga pelaku pencemaran lingkungan", "C": "maraknya pengaruh kekuasaan dan praktik suap dalam menjalankan proses hukum", "D": "maraknya pelanggaran hukum yang diselesaikan secara kekeluargaan", "E": "rendahnya kesadaran pengusaha dalam menjaga kelestarian lingkungan alam"}, "kunci": "C"}, {"no": 28, "tipe": "mcma", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menunjukkan cara/upaya menjaga kebhinekaan yang dapat menjadi modal sosial pembangunan nasional", "pembahasan": "Upaya menjaga kebinekaan yang menjadi modal sosial adalah pertukaran ide dan pengalaman antarkelompok (B), peningkatan interaksi dan pemahaman antarbudaya melalui kerja sama seni dan budaya (C), serta kerja sama seni dan budaya yang meningkatkan penghargaan terhadap budaya lain dan komunikasi antarbudaya (E). Pilihan A dan D membahas hasil dan tanggung jawab pembangunan secara umum, bukan upaya menjaga kebinekaan.", "soal": "Dalam rangka menjaga kebinekaan, kerja sama dan toleransi merupakan konsep yang sangat penting dalam membangun hubungan yang harmonis dan damai antara individu, kelompok, dan masyarakat. Kerjasama dapat dilakukan dalam berbagai bidang, seperti ekonomi, politik, sosial, dan budaya untuk meningkatkan efisiensi, efektivitas, dan kualitas hasil kerja. Sedangkan toleransi dilakukan dalam rangka membangun hubungan yang harmonis dan damai antara individu dan kelompok yang berbeda. Berdasarkan ilustrasi tersebut, mana saja pernyataan berikut yang menunjukkan upaya menjaga kebinekaan untuk menjadi modal sosial pembangunan nasional?", "opsi": {"A": "Meningkatkan kualitas hidup masyarakat melalui pembangunan yang berbasis pada kebutuhan dan aspirasi masyarakat, sehingga masyarakat dapat merasa sejahtera dan bahagia.", "B": "Meningkatkan kreativitas dan inovasi melalui pertukaran ide dan pengalaman antar kelompok masyarakat, sehingga dapat mempromosikan pembangunan yang inovatif dan efektif.", "C": "Membantu meningkatkan interaksi dan pemahaman antara budaya yang berbeda serta kerja sama seni dan budaya dalam rangka meningkatkan penghargaan terhadap budaya lain.", "D": "Meningkatkan kesadaran dan rasa tanggung jawab masyarakat terhadap pembangunan nasional, sehingga masyarakat dapat merasa memiliki dan bertanggung jawab terhadap masa depan bangsa.", "E": "Menjalin kerja sama seni dan budaya dapat membantu meningkatkan penghargaan terhadap budaya serta penggunaan teknologi yang dapat meningkatkan komunikasi dan interaksi antara budaya yang berbeda."}, "kunci": ["B", "C", "E"]}, {"no": 29, "tipe": "mcma", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menjelaskan tujuan partisipasi pemilih pemula dalam kehidupan demokrasi", "pembahasan": "Tujuan partisipasi pemilih pemula: memberikan suara untuk memilih pemimpin yang membawa perubahan positif (A), membangun kesadaran pemilih pemula untuk terlibat dalam pemilihan (C), serta menggunakan hak pilih sesuai hati nurani dengan menimbang kompetensi pemimpin (E). Pilihan B bukan tujuan partisipasi dalam pemilu, dan D salah karena memilih berdasarkan kepentingan kelompok bertentangan dengan pelajaran yang diikuti Reza.", "soal": "Menjelang pemilu serentak, pemerintah dan berbagai organisasi mengadakan sosialisasi untuk pemilih pemula di tingkat SMA. Reza seorang siswa kelas XII mengikuti kegiatan sosialisasi tersebut. Ia belajar pentingnya mengenali visi misi calon wakil rakyat, menghindari politik uang, dan menggunakan hak pilih dengan bijak. Reza juga mengajak teman-temannya untuk ikut serta dalam pemilu sebagai wujud tanggung jawab warga negara. Berdasarkan ilustrasi tersebut, pernyataan manakaah yang menunjukkan tujuan partisipasi pemilih pemula seperti Reza dalam pesta demokrasi?.", "opsi": {"A": "Memberikan suara untuk menentukan pemimpin yang membawa perubahan positif.", "B": "Menunjukkan jati diri sebagai pelajar yang bertanggung jawab terhadap masa depan.", "C": "Membangun kesadaran para pemilih pemula untuk terlibat dalam proses pemilihan.", "D": "Menolak segala bentuk politik uang dan memilih berdasarkan kepentingan kelompok.", "E": "Menggunakan hak pilih seseuai hati nurani dengan mempertimbangkan kompetensi pemimpin."}, "kunci": ["A", "C", "E"]}, {"no": 30, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menganalisis keunggulan nilai-nilai Pancasila dalam aktivitas internasional", "pembahasan": "Misi perdamaian dunia merupakan amanat Pembukaan UUD 1945 untuk mewujudkan perdamaian abadi dan keadilan sosial. Keunggulan nilai Pancasila yang paling tepat adalah penerapan keadilan sosial dengan mewujudkan perdamaian di kancah global. Pilihan lain menekankan kepentingan politik atau geopolitik, bukan nilai Pancasila.", "soal": "Sejak 1957, Indonesia telah mengirim lebih dari 30.000 personel TNI ke berbagai negara konflik sebagai bagian dari misi perdamaian dunia. Peran serta Indonesia ini merupakan perwujudan nilai Pancasila dan amanat Pembukaan UUD NRI Tahun 1945 untuk mewujudkan perdamaian berdasarkan kemerdekaan, perdamaian abadi, dan keadilan sosial. Keunggulan nilai Pancasila dalam peran tersebut adalah....", "opsi": {"A": "mewujudkan solidaritas kemanusiaan melalui politik luar negeri bebas aktif", "B": "menunjukkan komitmen terhadap nilai persatuan dalam kerja sama internasional", "C": "menerapkan keadilan sosial dengan mewujudkan perdamaian di kancah global", "D": "memperkuat posisi Indonesia dalam persaingan geopolitik khususnya kawasan asia", "E": "mewujudkan tujuan nasional dengan berupaya menjaga kepentingan strategis global"}, "kunci": "C"}], 2: [{"no": 1, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menganalisis pentingnya Pancasila sebagai dasar negara dalam proses pembentukan aturan", "soal": "Dalam menyusun peraturan daerah tentang pengelolaan pasar tradisional, DPRD terlebih dahulu menyerap aspirasi pedagang, pembeli, dan pengelola pasar sebelum menetapkan aturan. Berdasarkan ilustrasi, pentingnya Pancasila sebagai dasar negara dalam proses tersebut adalah ....", "opsi": {"A": "menjadi alat untuk membatasi kewenangan DPRD dalam menyusun peraturan daerah", "B": "menjadi sumber nilai agar peraturan yang dibuat mencerminkan kepentingan rakyat secara adil", "C": "menjadi pedoman teknis penyusunan pasal-pasal dalam peraturan daerah", "D": "menjadi dasar agar pemerintah daerah mengutamakan kepentingan kelompok pedagang", "E": "menjadi aturan yang secara langsung mengatur hak pedagang dan pembeli"}, "kunci": "B", "pembahasan": "Pancasila adalah sumber dari segala sumber hukum. Menyerap aspirasi berbagai pihak mencerminkan sila keempat dan kelima, sehingga aturan yang dibuat adil bagi seluruh rakyat. Pilihan A, C, dan E menempatkan Pancasila sebagai alat atau aturan teknis, padahal fungsinya sebagai sumber nilai. Pilihan D keliru karena memihak satu kelompok."}, {"no": 2, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Memberikan contoh hak/kewajiban warga negara yang mencerminkan salah satu pasal UUD NRI Tahun 1945", "soal": "Pasal 28E ayat (3) UUD NRI Tahun 1945 menyatakan bahwa setiap orang berhak atas kebebasan berserikat, berkumpul, dan mengeluarkan pendapat. Sekelompok mahasiswa menyampaikan kritik terhadap kebijakan kampus melalui aksi damai yang telah diberitahukan kepada pihak berwenang dan tidak mengganggu ketertiban umum. Berdasarkan ilustrasi, kewajiban yang menyertai hak tersebut adalah ....", "opsi": {"A": "mengajak sebanyak mungkin peserta agar aspirasi didengar", "B": "memastikan setiap kritik langsung dilaksanakan oleh pihak kampus", "C": "menggunakan hak tersebut tanpa batasan agar kebebasan terjamin", "D": "menghormati hak orang lain dan tunduk pada pembatasan yang ditetapkan undang-undang", "E": "meminta persetujuan dari seluruh warga di sekitar lokasi kegiatan"}, "kunci": "D", "pembahasan": "Pasal 28J UUD NRI 1945 mewajibkan setiap orang menghormati hak asasi orang lain dan menaati pembatasan yang ditetapkan undang-undang. Aksi damai yang diberitahukan kepada aparat dan tidak mengganggu ketertiban adalah contohnya. Pilihan A dan B tidak berkaitan dengan kewajiban, C bertentangan dengan Pasal 28J, dan E tidak disyaratkan oleh aturan."}, {"no": 3, "tipe": "mcma", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menentukan sikap positif yang dapat memperkuat harmoni dalam keberagaman", "soal": "Di sebuah desa, warga yang berbeda agama bergotong royong membangun balai desa. Tokoh adat dan tokoh agama bersama-sama menyusun jadwal kegiatan agar tidak bertabrakan dengan hari besar keagamaan warga. Berdasarkan informasi tersebut, pernyataan mana saja yang menunjukkan sikap yang memperkuat harmoni dalam keberagaman?", "opsi": {"A": "mengutamakan musyawarah dengan melibatkan tokoh dari berbagai kelompok dalam mengambil keputusan", "B": "membatasi keterlibatan kelompok kecil agar kegiatan lebih cepat selesai", "C": "menyesuaikan jadwal kegiatan dengan hari besar keagamaan warga", "D": "bekerja sama tanpa membedakan latar belakang agama dan suku dalam pembangunan", "E": "menyerahkan semua keputusan kepada kelompok terbesar agar tidak terjadi perdebatan"}, "kunci": ["A", "C", "D"], "pembahasan": "Sikap yang memperkuat harmoni adalah musyawarah yang melibatkan semua pihak (A), menghormati hari besar keagamaan warga (C), dan bekerja sama tanpa membeda-bedakan latar belakang (D). Pilihan B dan E menyisihkan kelompok tertentu dari pengambilan keputusan sehingga bertentangan dengan semangat Bhinneka Tunggal Ika."}, {"no": 4, "tipe": "pg", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menganalisis upaya melindungi keutuhan NKRI berdasarkan Wawasan Nusantara", "soal": "Beberapa kabupaten di wilayah perbatasan merasa tertinggal karena akses jalan, listrik, dan layanan kesehatan yang terbatas. Akibatnya, sebagian warga lebih mudah berinteraksi dengan wilayah negara tetangga. Upaya pemerintah yang paling tepat untuk menjaga keutuhan NKRI sesuai Wawasan Nusantara adalah ....", "opsi": {"A": "membangun infrastruktur dan layanan publik di perbatasan agar warga merasa menjadi bagian dari satu kesatuan bangsa", "B": "melarang warga perbatasan berinteraksi dengan warga negara tetangga", "C": "memindahkan penduduk perbatasan ke pusat kota agar lebih mudah diawasi", "D": "memusatkan pembangunan di ibu kota agar pelaksanaannya lebih efisien", "E": "memperbanyak pos pemeriksaan tanpa memperhatikan kesejahteraan warga"}, "kunci": "A", "pembahasan": "Wawasan Nusantara memandang Indonesia sebagai satu kesatuan politik, ekonomi, sosial budaya, dan pertahanan keamanan. Pemerataan pembangunan di perbatasan menumbuhkan rasa memiliki dan mencegah disintegrasi. Pilihan B, C, D, dan E tidak menyelesaikan akar masalah, yaitu kesenjangan dan keterbatasan layanan."}, {"no": 5, "tipe": "kategori", "elemen": "Pancasila", "indikator": "Menentukan perilaku yang mencerminkan nilai Pancasila dalam penghormatan hak asasi manusia", "soal": "Sebuah perusahaan menutup pabriknya dan memberhentikan karyawan secara sepihak tanpa pesangon. Serikat pekerja memilih menempuh mediasi dan pengaduan resmi kepada dinas ketenagakerjaan.\n\nBerdasarkan ilustrasi, klik Benar atau Salah dari setiap pernyataan berikut yang menunjukkan perilaku sesuai nilai Pancasila dalam menghormati hak asasi manusia!", "pernyataan": ["Memblokir jalan umum sampai tuntutan dipenuhi mencerminkan sila kedua karena bentuk perjuangan hak pekerja", "Menempuh mediasi dan pengaduan resmi mencerminkan penyelesaian masalah secara musyawarah dan menghormati hukum", "Pemberian pesangon sesuai ketentuan merupakan wujud keadilan sosial bagi seluruh rakyat Indonesia"], "kunci": [0, 1, 1], "pembahasan": "Pernyataan 1 Salah: memblokir jalan umum merugikan hak pengguna jalan lain sehingga tidak mencerminkan kemanusiaan yang adil dan beradab. Pernyataan 2 Benar: mediasi dan pengaduan resmi adalah penyelesaian secara musyawarah dan taat hukum. Pernyataan 3 Benar: pesangon sesuai ketentuan adalah perlindungan hak pekerja dan wujud keadilan sosial."}, {"no": 6, "tipe": "pg", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menentukan sikap positif terhadap perbedaan budaya di lingkungan sekitar", "soal": "Seorang siswa pindahan dari Nusa Tenggara Timur memiliki logat bicara yang berbeda dan sering menjadi bahan tertawaan teman-teman sekelasnya. Wali kelas ingin menumbuhkan sikap saling menghargai di kelasnya. Tindakan wali kelas yang paling tepat adalah ....", "opsi": {"A": "meminta siswa pindahan segera menyesuaikan logatnya dengan teman-temannya", "B": "memisahkan kelompok belajar berdasarkan daerah asal agar tidak terjadi konflik", "C": "membiarkan kejadian tersebut karena dianggap hal sepele", "D": "melarang penggunaan bahasa daerah di lingkungan sekolah", "E": "memberi pemahaman bahwa perbedaan logat dan budaya adalah kekayaan bangsa yang harus dihargai"}, "kunci": "E", "pembahasan": "Sikap yang tepat adalah menanamkan penghargaan terhadap perbedaan sebagai kekayaan bangsa. Pilihan A memaksa penyeragaman, B justru memisahkan siswa, C membiarkan perundungan berlanjut, dan D menghilangkan kekayaan bahasa daerah."}, {"no": 7, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menjelaskan wujud pelaksanaan pasal UUD NRI Tahun 1945 oleh pemerintah", "soal": "Pasal 31 ayat (2) UUD NRI Tahun 1945 menyatakan bahwa setiap warga negara wajib mengikuti pendidikan dasar dan pemerintah wajib membiayainya. Di sebuah daerah terpencil, banyak anak tidak bersekolah karena kendala biaya dan jarak ke sekolah. Upaya pemerintah yang sesuai dengan amanat pasal tersebut adalah ....", "opsi": {"A": "mewajibkan orang tua membayar seluruh biaya pendidikan dasar anak", "B": "mendorong pendirian sekolah swasta sebagai satu-satunya penyelenggara pendidikan", "C": "membiayai pendidikan dasar dan menyediakan bantuan agar semua anak dapat bersekolah", "D": "menyelenggarakan pendidikan hanya bagi anak yang berprestasi", "E": "menyerahkan penyelenggaraan pendidikan sepenuhnya kepada masyarakat"}, "kunci": "C", "pembahasan": "Pasal 31 ayat (2) mewajibkan pemerintah membiayai pendidikan dasar. Wujudnya adalah pembiayaan dan bantuan agar anak dapat bersekolah, termasuk di daerah terpencil. Pilihan A, B, D, dan E mengalihkan tanggung jawab atau membatasi akses pendidikan."}, {"no": 8, "tipe": "pg", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menjelaskan peran warga negara dalam bela negara menghadapi ancaman nonmiliter", "soal": "Sebuah layanan publik daerah mengalami serangan siber sehingga data pribadi ribuan penduduk bocor dan beredar di internet. Peran warga negara dalam bela negara untuk menghadapi ancaman tersebut adalah ....", "opsi": {"A": "mengangkat senjata untuk menyerang pelaku serangan", "B": "meningkatkan literasi digital, menjaga keamanan data pribadi, dan tidak menyebarkan data yang bocor", "C": "membiarkan masalah ini karena sepenuhnya menjadi tugas TNI", "D": "menyebarluaskan data yang bocor agar masyarakat waspada", "E": "menghindari seluruh penggunaan teknologi digital"}, "kunci": "B", "pembahasan": "Ancaman siber termasuk ancaman nonmiliter, sehingga bela negara diwujudkan lewat literasi digital dan menjaga data. Pilihan A tidak sesuai karena penegakan hukum adalah wewenang aparat, C mengabaikan hak dan kewajiban warga, D memperluas kerugian, dan E tidak realistis."}, {"no": 9, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menganalisis sifat Pancasila sebagai ideologi terbuka", "soal": "Perkembangan kecerdasan buatan memunculkan persoalan baru seperti hak cipta dan perlindungan privasi. Pemerintah menyusun aturan baru untuk menjawabnya dengan tetap berpegang pada nilai-nilai Pancasila. Hal tersebut menunjukkan bahwa Pancasila merupakan ideologi yang ....", "opsi": {"A": "tertutup dan tidak menerima perubahan apa pun", "B": "nilai dasarnya dapat diganti mengikuti perkembangan teknologi", "C": "meniru ideologi negara maju dalam menghadapi persoalan baru", "D": "membatasi pemanfaatan teknologi baru dalam kehidupan masyarakat", "E": "terbuka, nilai dasarnya tetap, sedangkan penjabarannya dapat dikembangkan sesuai perkembangan zaman"}, "kunci": "E", "pembahasan": "Ideologi terbuka memiliki nilai dasar yang tetap, sedangkan nilai instrumental dan praksisnya dapat dikembangkan sesuai kebutuhan zaman. Aturan baru tentang teknologi adalah nilai instrumental yang tetap bersumber dari nilai dasar Pancasila."}, {"no": 10, "tipe": "mcma", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menentukan penerapan Pasal 33 UUD NRI Tahun 1945 dalam kehidupan ekonomi", "soal": "Pasal 33 UUD NRI Tahun 1945 mengatur dasar perekonomian nasional. Pemerintah daerah mengelola sumber mata air untuk memenuhi kebutuhan air bersih warga dan membuka usaha pengelolaan air yang melibatkan koperasi desa. Berdasarkan ilustrasi, pernyataan mana saja yang sesuai dengan Pasal 33 UUD NRI Tahun 1945?", "opsi": {"A": "Pengelolaan air diserahkan sepenuhnya kepada perusahaan asing demi efisiensi", "B": "Sumber daya air dikuasai negara dan dimanfaatkan sebesar-besarnya untuk kemakmuran rakyat", "C": "Cabang produksi yang menguasai hajat hidup orang banyak dikuasai oleh negara", "D": "Perekonomian disusun berdasarkan persaingan bebas tanpa campur tangan negara", "E": "Perekonomian disusun sebagai usaha bersama berdasar asas kekeluargaan, misalnya melalui koperasi"}, "kunci": ["B", "C", "E"], "pembahasan": "Pasal 33 menyatakan perekonomian disusun sebagai usaha bersama berdasar asas kekeluargaan (E), cabang produksi penting yang menguasai hajat hidup orang banyak dikuasai negara (C), serta bumi, air, dan kekayaan alam dikuasai negara untuk sebesar-besar kemakmuran rakyat (B). Pilihan A dan D bertentangan dengan ketentuan tersebut."}, {"no": 11, "tipe": "pg", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menganalisis upaya menghadapi ancaman terhadap integrasi nasional", "soal": "Menjelang pemilihan kepala daerah, beredar banyak unggahan di media sosial yang memuat berita bohong bernuansa suku dan agama. Unggahan itu memicu saling curiga antarkelompok warga. Upaya yang tepat dilakukan warga untuk menjaga integrasi nasional adalah ....", "opsi": {"A": "memeriksa kebenaran informasi sebelum membagikannya dan melaporkan konten bernuansa SARA kepada pihak berwenang", "B": "membalas unggahan tersebut dengan unggahan serupa dari sudut pandang kelompoknya", "C": "menutup akun media sosial dan tidak mengikuti informasi apa pun", "D": "membagikan unggahan itu ke grup keluarga agar anggota keluarga waspada", "E": "menunggu pemerintah menyelesaikan masalah tanpa ikut berperan"}, "kunci": "A", "pembahasan": "Verifikasi informasi dan pelaporan konten SARA adalah tindakan konkret mencegah hoaks yang mengancam persatuan. Pilihan B memperkeruh suasana, C dan E bersikap pasif, dan D menyebarkan hoaks lebih luas."}, {"no": 12, "tipe": "kategori", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menjelaskan sistem pertahanan dan keamanan negara Indonesia", "soal": "Indonesia menganut sistem pertahanan dan keamanan rakyat semesta (Sishankamrata) yang melibatkan seluruh warga negara, wilayah, dan sumber daya nasional.\n\nBerdasarkan ilustrasi, klik Benar atau Salah dari setiap pernyataan berikut tentang sistem pertahanan negara!", "pernyataan": ["Tentara Nasional Indonesia merupakan komponen utama dalam sistem pertahanan negara", "Warga negara biasa tidak memiliki hak dan kewajiban dalam usaha pertahanan negara", "Sistem pertahanan semesta melibatkan seluruh warga, wilayah, dan sumber daya nasional"], "kunci": [1, 0, 1], "pembahasan": "Pernyataan 1 Benar: TNI adalah komponen utama pertahanan negara. Pernyataan 2 Salah: Pasal 27 ayat (3) dan Pasal 30 ayat (1) UUD NRI 1945 menyatakan setiap warga negara berhak dan wajib ikut serta dalam usaha pembelaan dan pertahanan negara. Pernyataan 3 Benar: itulah ciri sistem pertahanan semesta."}, {"no": 13, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menentukan nilai Pancasila yang diterapkan pada suatu peristiwa", "soal": "Pemerintah desa membagikan bantuan sosial berdasarkan data kemiskinan yang telah diverifikasi. Keluarga yang paling membutuhkan menerima bantuan lebih dahulu dan jumlahnya disesuaikan dengan kondisi keluarga. Berdasarkan ilustrasi, nilai Pancasila yang paling tepat diterapkan adalah ....", "opsi": {"A": "Persatuan, karena setiap keluarga menerima jumlah bantuan yang persis sama", "B": "Kemanusiaan, karena warga desa saling menolong dalam kesulitan", "C": "Keadilan sosial, karena bantuan diberikan sesuai kebutuhan sehingga kesejahteraan lebih merata", "D": "Ketuhanan, karena penyaluran bantuan dilakukan dengan niat ibadah", "E": "Kerakyatan, karena warga ikut memilih kepala desa yang membagikan bantuan"}, "kunci": "C", "pembahasan": "Bantuan yang diverifikasi dan disesuaikan dengan kebutuhan adalah wujud sila kelima, yaitu keadilan sosial bagi seluruh rakyat Indonesia. Adil bukan berarti sama rata tanpa melihat kebutuhan, sehingga pilihan A kurang tepat. Pilihan B, D, dan E tidak disebut dalam ilustrasi."}, {"no": 14, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menentukan alasan pembagian urusan pemerintah pusat dan pemerintah daerah", "soal": "Seorang bupati berencana menandatangani perjanjian kerja sama pertahanan dengan sebuah negara tetangga agar wilayahnya lebih aman. Rencana itu dibatalkan karena dianggap melampaui kewenangan. Alasan pembatalan tersebut adalah ....", "opsi": {"A": "politik luar negeri dan pertahanan merupakan urusan pemerintah pusat yang tidak diserahkan kepada daerah", "B": "pemerintah daerah tidak memiliki otonomi sama sekali dalam menjalankan pemerintahan", "C": "bupati hanya diperbolehkan mengurus bidang pendidikan dan kesehatan", "D": "perjanjian dengan negara lain hanya boleh ditandatangani oleh DPRD", "E": "kerja sama dengan negara lain dilarang bagi seluruh pihak di Indonesia"}, "kunci": "A", "pembahasan": "Pasal 18 UUD NRI 1945 memberi daerah otonomi seluas-luasnya kecuali urusan pemerintahan yang ditentukan sebagai urusan pusat, yaitu politik luar negeri, pertahanan, keamanan, yustisi, moneter dan fiskal nasional, serta agama. Pilihan B sampai E tidak sesuai dengan ketentuan tersebut."}, {"no": 15, "tipe": "kategori", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menjelaskan makna dan landasan semboyan Bhinneka Tunggal Ika", "soal": "Bhinneka Tunggal Ika merupakan semboyan bangsa Indonesia yang berasal dari kitab Sutasoma karangan Mpu Tantular.\n\nKlik Benar atau Salah dari setiap pernyataan berikut tentang Bhinneka Tunggal Ika!", "pernyataan": ["Bhinneka Tunggal Ika tercantum pada lambang negara Garuda Pancasila", "Bhinneka Tunggal Ika bermakna bahwa semua perbedaan harus diseragamkan menjadi satu budaya", "Bhinneka Tunggal Ika berarti berbeda-beda tetapi tetap satu"], "kunci": [1, 0, 1], "pembahasan": "Pernyataan 1 Benar: Pasal 36A UUD NRI 1945 menetapkan lambang negara Garuda Pancasila dengan semboyan Bhinneka Tunggal Ika. Pernyataan 2 Salah: semboyan ini mengakui dan menghargai perbedaan, bukan menyeragamkannya. Pernyataan 3 Benar: itulah arti harfiahnya."}, {"no": 16, "tipe": "pg", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menjelaskan peran Indonesia dalam perdamaian dunia", "soal": "Pemerintah Indonesia mengirim bantuan kemanusiaan dan tim medis ke sebuah negara yang dilanda gempa besar, tanpa memihak pihak mana pun yang bertikai di kawasan tersebut. Tindakan tersebut mencerminkan ....", "opsi": {"A": "upaya memperluas wilayah kekuasaan Indonesia", "B": "keberpihakan Indonesia kepada salah satu blok kekuatan dunia", "C": "campur tangan Indonesia terhadap urusan dalam negeri negara lain", "D": "pelaksanaan politik luar negeri bebas aktif untuk ikut melaksanakan ketertiban dunia sesuai alinea keempat Pembukaan UUD NRI 1945", "E": "pembatasan hubungan Indonesia dengan negara lain"}, "kunci": "D", "pembahasan": "Alinea keempat Pembukaan UUD NRI 1945 menugaskan Indonesia ikut melaksanakan ketertiban dunia berdasarkan kemerdekaan, perdamaian abadi, dan keadilan sosial. Bantuan kemanusiaan tanpa memihak adalah wujud politik luar negeri bebas aktif."}, {"no": 17, "tipe": "mcma", "elemen": "Pancasila", "indikator": "Menentukan perilaku yang mencerminkan Pancasila sebagai pandangan hidup bangsa", "soal": "Pancasila menjadi pandangan hidup yang menuntun sikap dan perilaku bangsa Indonesia dalam kehidupan sehari-hari, baik di rumah, sekolah, maupun masyarakat. Pernyataan mana saja yang menunjukkan Pancasila sebagai pandangan hidup bangsa?", "opsi": {"A": "Warga memecahkan persoalan lingkungan melalui musyawarah mufakat", "B": "Siswa menjadikan kejujuran dan gotong royong sebagai pedoman bersikap", "C": "Pemerintah menerapkan sistem yang meniru sepenuhnya ideologi negara lain", "D": "Masyarakat menyelesaikan perbedaan pendapat dengan mengutamakan kepentingan bersama", "E": "Warga bersikap sesuai kepentingan pribadi agar urusan cepat selesai"}, "kunci": ["A", "B", "D"], "pembahasan": "Pandangan hidup berarti nilai Pancasila dijadikan pedoman perilaku, misalnya musyawarah (A), kejujuran dan gotong royong (B), serta mengutamakan kepentingan bersama (D). Pilihan C meninggalkan jati diri bangsa, dan E mengutamakan kepentingan pribadi."}, {"no": 18, "tipe": "pg", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menentukan hak warga negara yang dilanggar pada suatu peristiwa", "soal": "Dua orang melakukan pelanggaran yang sama. Salah satu diproses dan dihukum, sedangkan yang lain dibebaskan karena merupakan kerabat seorang pejabat. Berdasarkan ilustrasi, hak warga negara yang dilanggar menurut UUD NRI Tahun 1945 adalah ....", "opsi": {"A": "hak untuk ikut serta dalam usaha pembelaan negara", "B": "hak untuk memeluk agama dan beribadah sesuai keyakinan", "C": "hak untuk memperoleh pendidikan", "D": "hak untuk memperoleh pekerjaan dan penghidupan yang layak", "E": "hak atas perlakuan yang sama di hadapan hukum sebagaimana diatur Pasal 27 ayat (1) dan Pasal 28D ayat (1)"}, "kunci": "E", "pembahasan": "Pasal 27 ayat (1) menegaskan segala warga negara bersamaan kedudukannya di dalam hukum dan pemerintahan. Pasal 28D ayat (1) menjamin kepastian hukum yang adil dan perlakuan yang sama di hadapan hukum. Memberi perlakuan berbeda karena hubungan kekerabatan melanggar hak tersebut."}, {"no": 19, "tipe": "pg", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menentukan latar belakang suatu tradisi dapat menjadi modal sosial pembangunan", "soal": "Di banyak desa di Indonesia masih hidup tradisi gotong royong, seperti sambatan di Jawa. Warga bergantian membantu membangun rumah atau memperbaiki jalan tanpa upah. Alasan tradisi tersebut dapat menjadi modal sosial pembangunan Indonesia adalah ....", "opsi": {"A": "tradisi ini dapat menggantikan peran pemerintah dalam pembangunan", "B": "tradisi ini menumbuhkan kepercayaan dan kerja sama antarwarga sehingga program pembangunan dapat dilaksanakan bersama", "C": "tradisi ini menghilangkan perbedaan pendapat dalam masyarakat", "D": "tradisi ini semata-mata menarik wisatawan untuk datang ke desa", "E": "tradisi ini membuat warga selalu bergantung pada bantuan pihak luar"}, "kunci": "B", "pembahasan": "Modal sosial berupa kepercayaan, norma, dan jejaring kerja sama. Gotong royong memperkuat ketiganya sehingga pembangunan lebih mudah dan murah dilakukan bersama. Pilihan A dan C berlebihan, D hanya manfaat ekonomi, dan E bertentangan dengan semangat kemandirian."}, {"no": 20, "tipe": "pg", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menentukan alasan suatu peristiwa dapat memperkukuh persatuan dan kesatuan bangsa", "soal": "Di sebuah daerah yang pernah dilanda ketegangan menjelang pilkada, tokoh masyarakat, aparat keamanan, dan penyelenggara pemilu bersama-sama mendeklarasikan pilkada damai. Alasan kegiatan tersebut dapat memperkukuh persatuan dan kesatuan bangsa adalah ....", "opsi": {"A": "menghilangkan seluruh perbedaan pilihan politik di tengah masyarakat", "B": "mencegah calon lain ikut serta dalam pemilihan", "C": "menjaga persaingan politik tetap sehat sehingga perbedaan pilihan tidak memecah masyarakat", "D": "mempercepat penghitungan dan pengumuman hasil pemilihan", "E": "mengurangi biaya penyelenggaraan pemilihan kepala daerah"}, "kunci": "C", "pembahasan": "Deklarasi pilkada damai menjaga persaingan tetap sehat dan menghormati perbedaan pilihan, sehingga masyarakat tetap bersatu setelah pemilihan. Pilihan A tidak mungkin dan tidak demokratis, B melanggar hak calon, D dan E tidak berkaitan dengan persatuan."}, {"no": 21, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menentukan nilai Pancasila yang dilanggar pada peristiwa pelanggaran hak asasi manusia", "soal": "Seorang siswa menjadi korban perundungan oleh teman-temannya karena kondisi fisiknya. Ia diejek, dijauhi, dan direkam untuk ditertawakan di media sosial. Berdasarkan ilustrasi, nilai Pancasila yang paling tepat dilanggar adalah ....", "opsi": {"A": "Ketuhanan, karena pelaku tidak menjalankan ibadah dengan tertib", "B": "Persatuan, karena pelaku memecah kelompok pertemanan", "C": "Kerakyatan, karena keputusan tidak diambil dengan musyawarah", "D": "Kemanusiaan, karena tindakan tersebut merendahkan martabat sesama manusia", "E": "Keadilan sosial, karena korban tidak memperoleh fasilitas yang sama"}, "kunci": "D", "pembahasan": "Perundungan merendahkan harkat dan martabat orang lain sehingga melanggar sila kedua, Kemanusiaan yang Adil dan Beradab. Pilihan lain menyebut hal yang tidak ditunjukkan dalam ilustrasi."}, {"no": 22, "tipe": "kategori", "elemen": "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945", "indikator": "Menjelaskan kewenangan lembaga negara", "soal": "Lembaga-lembaga negara dalam UUD NRI Tahun 1945 memiliki tugas dan wewenang yang berbeda.\n\nKlik Benar atau Salah dari setiap pernyataan berikut tentang kewenangan lembaga negara!", "pernyataan": ["Dewan Perwakilan Rakyat memiliki fungsi legislasi, anggaran, dan pengawasan", "Majelis Permusyawaratan Rakyat berwenang menetapkan undang-undang bersama Presiden", "Dewan Perwakilan Daerah berwenang memutuskan persetujuan semua rancangan undang-undang bersama Presiden"], "kunci": [1, 0, 0], "pembahasan": "Pernyataan 1 Benar: DPR memiliki fungsi legislasi, anggaran, dan pengawasan. Pernyataan 2 Salah: undang-undang dibentuk oleh DPR dengan persetujuan bersama Presiden, sedangkan MPR berwenang mengubah dan menetapkan UUD. Pernyataan 3 Salah: DPD dapat mengajukan dan ikut membahas rancangan undang-undang tertentu terkait otonomi daerah, tetapi tidak memegang kewenangan memutuskan persetujuan seluruh rancangan undang-undang."}, {"no": 23, "tipe": "mcma", "elemen": "Bhinneka Tunggal Ika", "indikator": "Menunjukkan upaya mengatasi sikap kedaerahan yang berlebihan", "soal": "Di sebuah sekolah muncul kelompok-kelompok pertemanan berdasarkan asal daerah. Siswa dari daerah lain sering dijauhi dan tidak diajak bekerja sama. Pihak sekolah ingin mengatasi masalah tersebut. Pernyataan mana saja yang merupakan upaya yang tepat?", "opsi": {"A": "Melarang penggunaan bahasa daerah di seluruh lingkungan sekolah", "B": "Mengadakan kegiatan kolaboratif lintas daerah seperti proyek kelas dan pentas budaya", "C": "Memisahkan kelas berdasarkan asal daerah agar siswa merasa nyaman", "D": "Memasukkan nilai toleransi dan persatuan dalam pembelajaran dan tata tertib sekolah", "E": "Membuka ruang dialog antarsiswa untuk saling mengenal budaya masing-masing"}, "kunci": ["B", "D", "E"], "pembahasan": "Sikap kedaerahan berlebihan dapat diatasi dengan interaksi dan kerja sama lintas daerah (B), penanaman nilai toleransi (D), serta dialog untuk saling mengenal (E). Pilihan A menghilangkan kekayaan budaya, dan C memperkuat sekat antarsiswa."}, {"no": 24, "tipe": "pg", "elemen": "Negara Kesatuan Republik Indonesia", "indikator": "Menjelaskan wujud bela negara dalam kehidupan sehari-hari", "soal": "Sekelompok siswa SMA aktif dalam kegiatan Palang Merah Remaja, menjaga kebersihan lingkungan sekolah, dan belajar dengan sungguh-sungguh untuk berprestasi. Berdasarkan ilustrasi, pernyataan yang tepat mengenai bela negara adalah ....", "opsi": {"A": "bela negara hanya dapat diwujudkan melalui wajib militer", "B": "bela negara hanya menjadi tugas TNI dan Polri", "C": "bela negara baru dilakukan ketika negara berada dalam keadaan perang", "D": "bela negara hanya berlaku bagi warga negara yang sudah dewasa", "E": "bela negara dapat diwujudkan melalui kegiatan nonfisik seperti belajar sungguh-sungguh dan menjaga lingkungan"}, "kunci": "E", "pembahasan": "Bela negara tidak selalu berupa perlawanan fisik. Kegiatan kemanusiaan, menjaga lingkungan, dan belajar dengan sungguh-sungguh termasuk bela negara nonfisik yang dapat dilakukan setiap warga negara dalam keadaan damai maupun perang."}, {"no": 25, "tipe": "pg", "elemen": "Pancasila", "indikator": "Menganalisis Pancasila sebagai identitas nasional dalam pergaulan dunia", "soal": "Delegasi pelajar Indonesia mengikuti pertukaran budaya di luar negeri. Mereka menampilkan tarian dari berbagai daerah dan menjelaskan kehidupan masyarakat Indonesia yang rukun meski berbeda agama dan suku. Berdasarkan ilustrasi, Pancasila sebagai identitas nasional ditunjukkan dengan ....", "opsi": {"A": "memperkenalkan keberagaman budaya dan nilai toleransi yang menjadi ciri khas bangsa Indonesia kepada dunia", "B": "meniru kebiasaan negara tuan rumah agar mudah diterima", "C": "menunjukkan bahwa Indonesia lebih unggul daripada negara lain", "D": "menyembunyikan perbedaan agar Indonesia terlihat seragam", "E": " let SOAL = SETS[1];
const CONFIG = {durasiMenit: 60, storageKey: 'tka-pancasila-tryout-v1'};
const ELEM = {
  'Pancasila':{c:'var(--e-pancasila)'},
  'Undang-Undang Dasar Negara Republik Indonesia Tahun 1945':{c:'var(--e-uud)', s:'UUD NRI 1945'},
  'Bhinneka Tunggal Ika':{c:'var(--e-bti)'},
  'Negara Kesatuan Republik Indonesia':{c:'var(--e-nkri)', s:'NKRI'}
};
const TIPE = {pg:'Pilihan Ganda', mcma:'Pilihan Ganda Kompleks', kategori:'Benar / Salah'};
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const elLabel = e => (ELEM[e] && ELEM[e].s) || e;

let S = {set:1, phase:'start', student:{}, idx:0, answers:{}, ragu:{}, endAt:0, finishedAt:0, filter:'all'};
let tick = null;

function save(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(CONFIG.storageKey); if(r){ const o = JSON.parse(r); if(o && o.phase) S = Object.assign(S,o); } }catch(e){} }
function useSet(n){ S.set = SETS[n] ? n : 1; SOAL = SETS[S.set]; }
function reset(){ try{ localStorage.removeItem(CONFIG.storageKey); }catch(e){} S = {set:1, phase:'start', student:{}, idx:0, answers:{}, ragu:{}, endAt:0, finishedAt:0, filter:'all'}; useSet(1); clearInterval(tick); render(); window.scrollTo(0,0); }

/* ---------- Penilaian ---------- */
function answered(q){
  const a = S.answers[q.no];
  if(q.tipe==='pg') return !!a;
  if(q.tipe==='mcma') return Array.isArray(a) && a.length>0;
  return Array.isArray(a) && a.some(v => v===0 || v===1);
}
function grade(q){
  const a = S.answers[q.no];
  if(!answered(q)) return {pts:0, st:'none'};
  let pts = 0;
  if(q.tipe==='pg') pts = a===q.kunci ? 1 : 0;
  else if(q.tipe==='mcma'){
    const right = a.filter(x => q.kunci.includes(x)).length, wrong = a.length-right;
    pts = Math.max(0,(right-wrong)/q.kunci.length);
  } else pts = q.kunci.reduce((s,k,i)=> s + (a[i]===k?1:0),0)/q.kunci.length;
  return {pts, st: pts===1?'ok':(pts>0?'part':'bad')};
}
function hitung(){
  const g = SOAL.map(grade);
  const total = g.reduce((s,x)=>s+x.pts,0);
  return {g, total, nilai: Math.round(total/SOAL.length*1000)/10,
    ok:g.filter(x=>x.st==='ok').length, part:g.filter(x=>x.st==='part').length,
    bad:g.filter(x=>x.st==='bad').length, none:g.filter(x=>x.st==='none').length};
}

/* ---------- Layar mulai ---------- */

  const sd = S.student||{};
  const elems = Object.keys(ELEM).map(e=>`<div class="elem-row"><span class="dot" style="background:${e.startsWith('Undang')?'#aab0ff':ELEM[e].c}"></span>${esc(e==='Undang-Undang Dasar Negara Republik Indonesia Tahun 1945'?'UUD NRI Tahun 1945':e==='Negara Kesatuan Republik Indonesia'?'Negara Kesatuan Republik Indonesia (NKRI)':e)}</div>`).join('');
  $('#app').innerHTML = `
  <main class="start">
    <section class="start-hero">
      <div class="flagbar" aria-hidden="true"></div>
      <h1>Pendalaman <span>TKA</span> Pendidikan Pancasila Tingkat Lanjut</h1>
